      ${st.revealed ? rateButtons(it, c) : `<div class="stack" style="margin-top:14px"><button class="btn gold" data-act="reveal">نشانم بده</button><p class="muted" style="text-align:center;margin:0">روی هر حرف بزنی، همان کلمه باز می‌شود.</p></div>`}`;
  }
};

/* ---- محو تدریجی ---- */
WG.fade = {
  init: it => { const n = words(it.s, it.a).length; return { order: shuffle([...Array(n).keys()]), level: 0, max: n <= 3 ? 1 : 2, shown: new Set() }; },
  html: (it, st) => {
    const w = words(it.s, it.a), n = w.length;
    const cnt = st.level === 0 ? 0 : st.max === 1 ? Math.ceil(n / 2) : st.level === 1 ? Math.ceil(n / 3) : Math.ceil(2 * n / 3);
    const hid = new Set(st.order.slice(0, cnt).filter(i => !st.shown.has(i)));
    const msg = st.level === 0 ? 'آیه را کامل و بلند بخوان' : st.level === 1 ? 'چند کلمه پنهان شد. باز هم بلند بخوان' : 'کلمه‌های بیشتری پنهان شد. بلند بخوان';
    return `<p class="prompt">${msg}</p><div class="ayah big">${w.map((x, i) => hid.has(i) ? `<span class="w hide" data-act="peek" data-i="${i}" role="button" tabindex="0">${esc(x)}</span>` : `<span class="w">${esc(x)}</span>`).join(' ')}</div>
      <div class="stack" style="margin-top:14px"><button class="btn gold" data-act="fadeNext">خواندم ✅</button><p class="muted" style="text-align:center;margin:0">${st.level ? 'روی جای خالی بزنی، همان کلمه باز می‌شود.' : ''}</p></div>`;
  }
};

/* ---- حافظهٔ دو نیمه (چند آیه) ---- */
WG.memory = {
  init: it => {
    const cards = []; it.set.forEach((x, i) => { const w = words(x.s, x.a), k = Math.min(3, Math.floor(w.length / 2)); cards.push({ pair: i, t: w.slice(0, k).join(' ') + ' …' }, { pair: i, t: '… ' + w.slice(-k).join(' ') }); });
    return { cards: shuffle(cards), open: [], matched: new Set(), busy: false };
  },
  html: (it, st) => {
    const solved = st.matched.size === st.cards.length;
    return `<p class="prompt">${solved ? 'آفرین! همهٔ جفت‌ها پیدا شد' : 'ابتدا و انتهای هر آیه را جفت کن'}</p>
      <div class="mem">${st.cards.map((c, i) => { const up = st.open.includes(i) || st.matched.has(i); return `<button class="mc${up ? ' up' : ''}${st.matched.has(i) ? ' match' : ''}" data-act="memTap" data-i="${i}" ${up ? 'aria-label="باز"' : 'aria-label="بسته"'}>${up ? esc(c.t) : '🌿'}</button>`; }).join('')}</div>${solved ? contBtn : ''}`;
  }
};

/* ---- ردیف آیه‌ها (چند آیهٔ پشت‌سرهم) ---- */
const ayText = x => byId[x.s].v[x.a - 1][0];
WG.seq = {
  init: it => ({ bank: shufNot(it.set.map((_, i) => i)), picked: [] }),
  html: (it, st) => {
    const solved = st.picked.length === it.set.length;
    return `<p class="prompt">${solved ? 'آفرین! ترتیب درست است. همه را پشت‌سرهم بلند بخوان' : `آیه‌های سورهٔ ${esc(byId[it.set[0].s].fa)} را به ترتیب بچین`}</p>
      <div class="seq-slots">${it.set.map((x, j) => st.picked[j] != null ? `<div class="seq-slot full"><b>${fa(j + 1)}</b><span>${esc(ayText(it.set[st.picked[j]]))}</span></div>` : `<div class="seq-slot"><b>${fa(j + 1)}</b></div>`).join('')}</div>
      ${solved ? contBtn : `<div class="seq-bank">${st.bank.filter(i => !st.picked.includes(i)).map(i => `<button class="seq-card" data-act="seqTap" data-i="${i}">${esc(ayText(it.set[i]))}</button>`).join('')}</div>`}`;
  }
};

/* ---- گوش‌تیز ---- */
function lpOpts(it) {
  const want = byId[it.s].v[it.a - 1][0], pool = shuffle(byId[it.s].v.map(v => v[0]).filter(t => t !== want));
  if (pool.length < 2) shuffle(SUR.flatMap(s => s.v.map(v => v[0])).filter(t => t !== want && !pool.includes(t))).forEach(t => pool.length < 2 && pool.push(t));
  return shuffle([{ t: want, ok: true }, ...pool.slice(0, 2).map(t => ({ t, ok: false }))]);
}
WG.lp = {
  init: it => ({ opts: lpOpts(it), played: false, noAudio: false, solved: false }),
  html: (it, st) => `<p class="prompt">${st.solved ? 'آفرین! درست شنیدی' : 'آیه را بشنو و بگو کدام بود'}</p>
    <div class="stack"><button class="btn water" data-act="lpPlay">${st.played ? '🔁 دوباره بشنو' : '▶ بشنو'}</button>
    ${st.noAudio ? '<p class="muted" style="text-align:center;margin:0">فایل صوتی پیدا نشد. می‌توانی ادامه بدهی.</p><button class="btn ghost" data-act="wNext">ادامه</button>' : ''}</div>
    <div class="opts" style="margin-top:12px">${st.opts.map((o, i) => `<button class="opt ${o.cls || ''}" data-act="lpPick" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>${st.solved ? contBtn : ''}`
};

/* ============ فضای بازی‌ها ============ */
const GAMES = {
  puzzle: { emoji: '🧩', name: 'پازل آیه', desc: 'تکه‌های آیه را بکش و جای درستشان بگذار', hue: 205, kind: 'puzzle', need: w => w.length >= 3 },
  bubbles: { emoji: '🫧', name: 'حباب‌های کلمه', desc: 'حباب‌ها را به ترتیب آیه بترکان', hue: 185, kind: 'bubbles', need: w => w.length >= 2 },
  spot: { emoji: '🔍', name: 'اشتباه‌یاب', desc: 'جای اشتباه آیه را پیدا کن', hue: 18, kind: 'spot', need: w => w.length >= 2 },
  blank: { emoji: '✏️', name: 'جای خالی', desc: 'کلمهٔ جاافتاده را پیدا کن', hue: 150, kind: 'blank', need: w => w.length >= 2 },
  memory: { emoji: '🃏', name: 'حافظهٔ دو نیمه', desc: 'ابتدا و انتهای هر آیه را جفت کن', hue: 285, kind: 'memory', multi: true },
  seq: { emoji: '🪜', name: 'ردیف آیه‌ها', desc: 'آیه‌های پشت‌سرهم را مرتب کن', hue: 335, kind: 'seq', multi: true },
  listen: { emoji: '🎧', name: 'گوش‌تیز', desc: 'آیه را بشنو و پیدایش کن', hue: 45, kind: 'lp', need: () => true }
};
const learnedList = () => Object.keys(P().ay).map(k => { const [s, a] = k.split(':').map(Number), x = P().ay[k]; return { s, a, b: x.b, d: x.d }; });
const weakFirst = l => l.map(x => ({ x, r: x.b + Math.random() * 2.5 - (x.d <= today() ? 1 : 0) })).sort((p, q) => p.r - q.r).map(o => o.x);
function buildGame(id) {
  const g = GAMES[id], L = learnedList(), q = [];
  if (!g.multi) {
    const pool = weakFirst(L.filter(x => g.need(words(x.s, x.a))));
    for (let i = 0; i < 5 && pool.length; i++) { const x = pool[i % pool.length]; q.push({ t: 'rev', s: x.s, a: x.a, kind: g.kind, pr: true, game: id }); }
    return q;
  }
  if (id === 'memory') {
    const pool = L.filter(x => words(x.s, x.a).length >= 4); if (pool.length < 3) return q;
    for (let r = 0; r < (pool.length >= 8 ? 2 : 1); r++) { const set = shuffle(pool).slice(0, Math.min(5, pool.length)).map(x => ({ s: x.s, a: x.a })); q.push({ t: 'rev', s: set[0].s, a: set[0].a, kind: 'memory', set, multi: true, pr: true, game: id }); }
    return q;
  }
  const bySurah = {}; L.forEach(x => (bySurah[x.s] = bySurah[x.s] || []).push(x.a));
  const runs = []; Object.entries(bySurah).forEach(([s, l]) => { l.sort((p, q2) => p - q2); let cur = [l[0]]; for (let i = 1; i <= l.length; i++) { if (l[i] === cur[cur.length - 1] + 1) cur.push(l[i]); else { if (cur.length >= 3) runs.push({ s: +s, a: cur }); cur = [l[i]]; } } });
  for (let r = 0; r < 3 && runs.length; r++) {
    const run = pick(runs), len = Math.min(run.a.length, Math.random() < .5 ? 3 : 4), st = Math.random() * (run.a.length - len + 1) | 0;
    const set = run.a.slice(st, st + len).map(a => ({ s: run.s, a })); q.push({ t: 'rev', s: set[0].s, a: set[0].a, kind: 'seq', set, multi: true, pr: true, game: id });
  }
  return q;
}
const gameReason = id => id === 'memory' ? 'سه آیهٔ حفظ‌شده (چهار کلمه یا بیشتر) لازم است' : id === 'seq' ? 'سه آیهٔ پشت‌سرهم حفظ‌شده لازم است' : 'هنوز آیهٔ مناسبی نکاشته‌ای';
function startGame(id) {
  const q = buildGame(id); if (!q.length) { toast(gameReason(id)); return; }
  sess = null; startSession(q);
}
VIEW.games = () => {
  const nL = learnedList().length;
  const cards = Object.entries(GAMES).map(([id, g]) => {
    const ok = nL && buildGame(id).length > 0;
    return `<button class="gcard" style="--gh:${g.hue}" data-act="gameStart" data-g="${id}" ${ok ? '' : 'disabled'}><span class="gem" aria-hidden="true">${g.emoji}</span><span class="gtx"><b>${g.name}</b><small>${ok ? g.desc : gameReason(id)}</small></span><span class="go" aria-hidden="true">‹</span></button>`;
  }).join('');
  return `<div class="stack"><h1>بازی‌ها</h1>
    <p class="muted" style="margin:0">با آیه‌هایی که کاشته‌ای بازی کن تا محکم‌تر شوند. هر دورِ بی‌اشتباه یک ستاره دارد ⭐</p>
    ${nL ? '' : '<div class="card"><b>🌱 اول چند آیه بکار</b><p class="muted" style="margin:6px 0 0">بعد از کاشتن آیه‌ها، بازی‌ها باز می‌شوند.</p></div>'}
    <div>${cards}</div></div>`;
};

const CACHE_AU = 'hifz-audio-v1', CACHE_IM = 'hifz-img-v1';
const dl = { busy: false, cancel: false };
const mb = n => fa((n / 1048576).toFixed(n > 10 * 1048576 ? 0 : 1));
async function cacheCount(name) {
  try { if (!('caches' in window)) return -1; if (!(await caches.has(name))) return 0; return (await (await caches.open(name)).keys()).length; } catch (e) { return -1; }
}
const head = async u => { try { const r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); return r.ok; } catch (e) { return false; } };
async function findAudio() {                       // فایل‌های صوتی‌ای که روی همین سایت هست
  try {
    const r = await fetch('audio/timings.json', { cache: 'no-store' });
    if (r.ok) { const t = await r.json(), urls = ['audio/timings.json']; for (const s of Object.keys(t)) if (byId[s]) urls.push(suUrl(+s)); return urls; }
  } catch (e) { }
  const jobs = [], urls = []; SUR.forEach(s => { for (let a = 1; a <= s.v.length; a++) jobs.push(ayUrl(s.id, a)); });
  await runPool(jobs, 12, async u => { if (await head(u)) urls.push(u); });
  return urls;
}
async function dlScan() {
  const el = $('#dlStat'); if (!el) return;
  const [ca, ci] = await Promise.all([cacheCount(CACHE_AU), cacheCount(CACHE_IM)]);
  if (ca < 0) { el.textContent = 'ذخیرهٔ آفلاین فقط وقتی کار می‌کند که برنامه از یک آدرس اینترنتی (https) باز شده باشد.'; return; }
  let use = ''; try { const e = await navigator.storage.estimate(); use = `<br>فضای مصرفی برنامه: ${mb(e.usage)} مگابایت`; } catch (e) { }
  el.innerHTML = `🔊 صدا: ${fa(ca)} فایل ذخیره شده<br>🖼️ تصویر آیه‌ها: ${fa(ci)} از ${fa(TOTAL)} ذخیره شده${use}`;
}
function dlUI(busy, msg, pct) {
  const b = $('#dlBar'), m = $('#dlMsg'), c = $('#dlCancel');
  if (m && msg != null) m.textContent = msg; if (b && pct != null) b.style.width = pct + '%';
  document.querySelectorAll('[data-dl]').forEach(x => x.disabled = busy); if (c) c.hidden = !busy;
}
async function dlAudio() {
  dlUI(true, 'در حال یافتن فایل‌های صوتی…', 0);
  const urls = await findAudio();
  if (!urls.length) { dlUI(true, 'فایل صوتی روی این سایت پیدا نشد. آن‌ها را در پوشهٔ audio بگذارید (راهنما در README).', 0); return 0; }
  const cache = await caches.open(CACHE_AU), todo = []; for (const u of urls) if (!(await cache.match(u))) todo.push(u);
  let fail = 0;
  await runPool(todo, 4, async u => { if (dl.cancel) return; try { const r = await fetch(u); if (r.ok) await cache.put(u, r); else fail++; } catch (e) { fail++; } },
    (d, t) => dlUI(true, `صدا: ${fa(d)} از ${fa(t)}`, Math.round(d / t * 100)));
  return fail;
}
async function dlImages() {
  const local = await head(localImg(114, 1)), cache = await caches.open(CACHE_IM), todo = [];
  for (const s of SUR) for (let a = 1; a <= s.v.length; a++) { const u = local ? localImg(s.id, a) : imgUrl(s.id, a); if (!(await cache.match(u))) todo.push(u); }
  let fail = 0;
  await runPool(todo, 6, async u => {
    if (dl.cancel) return;
    try {
      let r; if (local) r = await fetch(u); else { try { r = await fetch(u, { mode: 'cors' }); } catch (e) { r = await fetch(u, { mode: 'no-cors' }); } }
      if (r.type !== 'opaque' && !r.ok) throw 0;
      await cache.put(u, r);
    } catch (e) { fail++; }
  }, (d, t) => dlUI(true, `تصویر آیه‌ها: ${fa(d)} از ${fa(t)}`, Math.round(d / t * 100)));
  return fail;
}
async function dlRun(what) {
  if (dl.busy) return;
  if (!('caches' in window)) { toast('ذخیرهٔ آفلاین فقط وقتی کار می‌کند که برنامه از آدرس اینترنتی (https) باز شود'); return; }
  dl.busy = true; dl.cancel = false; let fail = 0;
  try {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
    if (what !== 'img') fail += (await dlAudio()) || 0;
    if (what !== 'audio' && !dl.cancel) fail += await dlImages();
    dlUI(false, dl.cancel ? 'متوقف شد. هر چه دانلود شده بود نگه داشته شد.' : fail ? `${fa(fail)} فایل دانلود نشد. اینترنت را بررسی و دوباره امتحان کنید.` : 'تمام شد. این فایل‌ها بدون اینترنت هم کار می‌کنند.', 100);
  } catch (e) { dlUI(false, 'در دانلود خطا پیش آمد. اینترنت را بررسی کنید.'); }
  dl.busy = false; dlUI(false); dlScan();
}
async function dlDelete(what) {
  try { if (what !== 'img') await caches.delete(CACHE_AU); if (what !== 'audio') await caches.delete(CACHE_IM); } catch (e) { }
  audioMode = {}; toast('پاک شد'); dlScan();
}

const same = (c) => sess && sess.cur === c;

function advance() {
  const c = sess.cur;
  if (c.si + 1 < c.steps.length) { c.si++; initStep(); }
  else completeItem(c.it.t === 'new' ? 'good' : qRes(c.mist));
  draw();
}
function cleanProfile(p) {
  const n = x => Number.isFinite(+x) ? +x : 0;
  const q = { id: String(p.id || uid()).replace(/[^\w-]/g, ''), name: String(p.name || 'کودک').slice(0, 20), av: AVATARS.includes(p.av) ? p.av : AVATARS[0],
    ay: {}, days: {}, stars: n(p.stars), streak: { cur: n(p.streak && p.streak.cur), best: n(p.streak && p.streak.best), last: /^\d{4}-\d\d-\d\d$/.test(p.streak && p.streak.last) ? p.streak.last : '' },
    goal: { newPerDay: Math.min(5, Math.max(1, n(p.goal && p.goal.newPerDay) || 2)), revMax: Math.min(20, Math.max(5, n(p.goal && p.goal.revMax) || 10)) },
    cur: byId[p.cur] ? +p.cur : PATH[0], created: /^\d{4}-\d\d-\d\d$/.test(p.created) ? p.created : today() };
  for (const k in (p.ay || {})) {
    const [s, a] = k.split(':').map(Number), x = p.ay[k];
    if (byId[s] && a >= 1 && a <= byId[s].v.length && x && /^\d{4}-\d\d-\d\d$/.test(x.d)) q.ay[k] = { b: Math.min(5, Math.max(1, n(x.b) || 1)), d: x.d, n: n(x.n), l: n(x.l), t: /^\d{4}-\d\d-\d\d$/.test(x.t) ? x.t : x.d };
  }
  for (const d in (p.days || {})) if (/^\d{4}-\d\d-\d\d$/.test(d)) { const r = p.days[d] || {}; q.days[d] = { st: n(r.st), nw: n(r.nw), rv: n(r.rv), star: r.star ? 1 : 0 }; }
  return q;
}

  dlDel: el => confirmBox(el.dataset.what === 'audio' ? 'صداهای ذخیره‌شده پاک شوند؟' : 'تصویرهای ذخیره‌شده پاک شوند؟', 'پاک کن', () => dlDelete(el.dataset.what), true),
  import: () => $('#impf').click(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { if (!el.disabled && A[el.dataset.act]) A[el.dataset.act](el, e); return; }
  const w = e.target.closest('#rec .w.hide'); if (w) w.classList.remove('hide');
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.inp; if (!k) return;
  const v = +e.target.value; S.set[k] = v;
  if (k === 'repeats') $('#rpv').textContent = fa(v);
  if (k === 'rate') $('#rtv').textContent = fa(v.toFixed(2));
  if (k === 'fs') applyFs();
  save();
});
document.addEventListener('change', e => {
  if (e.target.id === 'dsur') { fillAyahs(); return; }
  if (e.target.id !== 'impf') return;
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const j = JSON.parse(t); if (!(j && j.v === 1 && j.profiles && typeof j.profiles === 'object')) throw 0;
      confirmBox('پیشرفت فعلی این دستگاه با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهی؟', 'جایگزین کن', () => {
        const ns = fresh(); ns.set = Object.assign(ns.set, j.set || {});
        ns.set.rate = Math.min(1.2, Math.max(.7, +ns.set.rate || 1)); ns.set.repeats = Math.min(7, Math.max(1, +ns.set.repeats || 3)); ns.set.fs = Math.min(1.4, Math.max(.9, +ns.set.fs || 1));
        ns.set.pin = /^\d{4}$/.test(ns.set.pin) ? ns.set.pin : ''; ns.set.sound = ns.set.sound !== false; ns.set.img = ns.set.img !== false;
        Object.values(j.profiles).forEach(p => { const q = cleanProfile(p || {}); ns.profiles[q.id] = q; });
        ns.active = ns.profiles[j.active] ? j.active : Object.keys(ns.profiles)[0] || null;
        S = ns; save(); applyFs(); toast('بازیابی شد'); draw();
      }, true);
    } catch (_) { toast('این فایل پشتیبان معتبر نیست'); }
    e.target.value = '';
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key !== 'Enter') return;
  const m = { pin: 'pinGo', ans: 'mathGo', nm: 'create', npin: 'savePin' }[e.target.id]; if (m) { e.preventDefault(); A[m](); }
});
window.addEventListener('hashchange', route);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (R().name !== 'lesson') draw(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
applyFs(); route();

/* کشیدن تکه‌های پازل با انگشت یا ماوس (زدن هم کار می‌کند) */
(function () {
  let d = null, moved = false;
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('.pz-piece'); if (!el) return;
    d = { el, x: e.clientX, y: e.clientY, r: el.getBoundingClientRect(), id: e.pointerId }; moved = false;
  });
  document.addEventListener('pointermove', e => {
    if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!moved && Math.hypot(dx, dy) < 10) return;
    if (!moved) { moved = true; d.el.classList.add('drag'); d.el.style.width = d.r.width + 'px'; }
    d.el.style.left = (d.r.left + dx) + 'px'; d.el.style.top = (d.r.top + dy) + 'px'; e.preventDefault();
  }, { passive: false });
  const end = e => {
    if (!d) return; const el = d.el, was = moved; d = null;
    if (!was) return;
    el.style.pointerEvents = 'none';
    const t = document.elementFromPoint(e.clientX, e.clientY), sl = t && t.closest('.pz-slot:not(.full)');
    el.classList.remove('drag'); el.style.cssText = '';
    if (sl) pzPlace(+el.dataset.pc, +sl.dataset.slot);
    window._noClick = Date.now();
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('click', e => { if (window._noClick && Date.now() - window._noClick < 300 && e.target.closest('.pz-piece')) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();

</script>
