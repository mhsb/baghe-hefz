<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>باغ حفظ</title>
<meta name="description" content="حفظ قرآن برای کودکان ۷ تا ۱۲ سال، با باغ و مرور فاصله‌دار. بدون اینترنت هم کار می‌کند.">
<meta name="theme-color" content="#2f9e6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:"Scheherazade New";src:url("fonts/scheherazade-new-regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#eaf7f3;--bg2:#d6efe8;--card:#fff;--ink:#16324f;--muted:#587087;--line:#d3e5df;
  --leaf:#2f9e6b;--leaf-d:#1d7a4e;--gold:#f2b134;--gold-d:#c98a0f;--rose:#e8577d;--water:#3fa7e0;--soil:#8a5a3b;--bad:#d9534f;
  --fs:1;--r:22px;
  --ui:"Vazirmatn","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --quran:"Scheherazade New","Amiri Quran","Amiri","Traditional Arabic",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:linear-gradient(#cfeee6,#eaf7f3 38%,#eaf7f3);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.7;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--water);outline-offset:3px;border-radius:12px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:14px 16px 112px}
.hide-nav main{padding-bottom:28px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;max-width:560px;margin:0 auto}
.who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;border-radius:99px;padding:4px 6px 4px 14px;background:rgba(255,255,255,.7)}
.av{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 0 0 3px var(--gold)}
.stats{margin-inline-start:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.98rem;box-shadow:0 1px 0 var(--line)}
.pill svg{width:20px;height:20px}

/* nav */
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px 8px;font-size:.88rem;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:28px;height:28px}
nav.tabs button[aria-current=page]{color:var(--leaf-d)}
nav.tabs button[aria-current=page] svg{transform:translateY(-2px)}

/* headings & cards */
h1{font-size:1.55rem;line-height:1.4;margin:6px 0 4px}
h2{font-size:1.2rem;margin:22px 0 8px}
p{margin:.4em 0}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line),0 8px 24px -14px rgba(22,50,79,.35)}
.stack>*+*{margin-top:12px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 22px;border-radius:99px;font-weight:800;font-size:1.1rem;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.water{background:var(--water);box-shadow:0 5px 0 #2582b8}
.btn.water:active{box-shadow:0 1px 0 #2582b8}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line),0 0 0 var(--line)}
.btn.danger{background:var(--bad);box-shadow:0 5px 0 #a73a36}
.btn.small{min-height:44px;font-size:1rem;padding:6px 16px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.row.wrap{flex-wrap:wrap}

/* hero scene */
.scene{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(#bfe9f2 0%,#e6f7ee 62%);box-shadow:0 10px 30px -18px rgba(22,50,79,.6);min-height:250px}
.scene .sun{position:absolute;top:14px;inset-inline-start:18px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#ffe596 0 40%,#f7c24a 41% 62%,rgba(247,194,74,.25) 63%)}
.scene .cloud{position:absolute;top:26px;inset-inline-end:26px;width:96px;height:30px;border-radius:99px;background:#fff;opacity:.85}
.scene .cloud:before{content:"";position:absolute;top:-14px;inset-inline-start:18px;width:42px;height:42px;border-radius:50%;background:#fff}
.scene .hill{position:absolute;inset-inline:-10%;bottom:0;height:62%;background:linear-gradient(#58b87f,#3a9b66);border-radius:50% 50% 0 0/36% 36% 0 0}
.scene .head{position:relative;padding:14px 18px 0;padding-inline-start:96px;min-height:74px;font-weight:800}
.scene .head small{display:block;font-weight:500;color:#3d6a7a;line-height:1.5}
.garden{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0;padding:44px 8px 18px}
.plant{width:var(--pw,44px);height:calc(var(--pw,44px)*1.4);position:relative;display:block}
.plant svg{width:100%;height:100%;overflow:visible}
.plant .drop{position:absolute;top:-6px;inset-inline-end:-2px;width:46%;height:auto;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.plant.pop svg{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) translateY(30%)}100%{transform:none}}

/* surah list */
.plot{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 14px;border-radius:20px;background:#fff;box-shadow:0 1px 0 var(--line),0 6px 18px -14px rgba(22,50,79,.5)}
.plot+.plot{margin-top:10px}
.plot .num{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c,var(--leaf));flex:none;font-size:1.1rem}
.plot .nm{font-weight:800;font-size:1.1rem;line-height:1.35}
.plot .nm .ar{font-family:var(--quran);font-weight:400;font-size:1.35rem;color:var(--muted);margin-inline-start:8px}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7fd3a3,var(--leaf));transition:width .5s}
.plot .meta{font-size:.9rem;color:var(--muted)}
.plot.next{box-shadow:0 0 0 3px var(--gold),0 8px 20px -12px rgba(201,138,15,.8)}
.medal{font-size:1.5rem;flex:none}
.tag{display:inline-block;background:var(--gold);color:#4a3200;border-radius:99px;font-size:.8rem;font-weight:800;padding:0 10px}

/* Quran text */
.ayah{font-family:var(--quran);font-size:calc(2.15rem*var(--fs));line-height:2.25;text-align:center;direction:rtl;padding:10px 6px;word-spacing:.12em}
.ayah .w{display:inline-block;padding:0 .12em;border-radius:10px;transition:background .2s}
.ayah .w.hide{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px) bottom/100% 5px no-repeat;cursor:pointer;user-select:none}
.ayah .w.hl{background:#fff3c4}
.ayah.big{font-size:calc(2.5rem*var(--fs))}
.bsm{font-family:var(--quran);text-align:center;font-size:calc(1.5rem*var(--fs));color:var(--muted);line-height:1.8}
.badge{display:inline-grid;place-items:center;min-width:2.1em;height:2.1em;border-radius:50%;border:2px solid var(--gold);font-family:var(--ui);font-size:.5em;font-weight:800;vertical-align:middle;margin-inline:.6em;color:var(--gold-d)}
.meaning{background:#f6fbf9;border:1px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:.98rem;line-height:1.9;color:#2a4660}

/* lesson */
.steps{display:flex;gap:6px;margin:4px 0 10px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--bg2)}
.steps i.on{background:var(--gold)}
.steps i.done{background:var(--leaf)}
.qhead{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:.95rem}
.qhead .x{margin-inline-start:auto;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 1px 0 var(--line)}
.prompt{font-size:1.2rem;font-weight:800;text-align:center;margin:8px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--bg2);box-shadow:inset 0 0 0 2px var(--line)}
.dots i.on{background:var(--gold);box-shadow:none}
.dots i.done{background:var(--leaf);box-shadow:none}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);font-family:var(--quran);font-size:calc(1.75rem*var(--fs));line-height:2;text-align:center;direction:rtl;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 2px var(--line)}
.opt.ok{background:#dff5e8;box-shadow:0 0 0 3px var(--leaf)}
.opt.no{background:#fde4e2;box-shadow:0 0 0 3px var(--bad);animation:shake .35s}
.opts.words{grid-template-columns:repeat(3,1fr)}
.opts.words .opt{font-size:calc(1.9rem*var(--fs));padding:4px 6px}
@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.slots{min-height:112px;border-radius:20px;border:3px dashed var(--line);background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;direction:rtl}
.slots.ok{border-color:var(--leaf);background:#eefaf3}
.chip{background:#fff;border-radius:16px;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);padding:2px 14px;font-family:var(--quran);font-size:calc(1.75rem*var(--fs));line-height:2;direction:rtl}
.chip:active{transform:translateY(3px)}
.chip.placed{background:#fff8e1;box-shadow:0 0 0 2px var(--gold),0 4px 0 var(--gold)}
.chip.no{animation:shake .35s;background:#fde4e2}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;direction:rtl;min-height:70px}
.rate{display:grid;gap:10px;margin-top:12px}
.rate .btn{font-size:1.05rem}

/* misc */
.empty{text-align:center;padding:28px 12px}
.big-emoji{font-size:64px;line-height:1.2}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;width:100%;text-align:start}
.li .grow{flex:1}
.avs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.avs button{width:56px;height:56px;border-radius:50%;font-size:30px;background:#fff;box-shadow:0 0 0 2px var(--line)}
.avs button[aria-pressed=true]{box-shadow:0 0 0 4px var(--gold);transform:scale(1.08)}
label.f{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select{width:100%;font:inherit;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--leaf)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 4px;border-radius:14px;background:#fff;box-shadow:0 0 0 2px var(--line);font-weight:800}
.seg button[aria-pressed=true]{background:var(--leaf);color:#fff;box-shadow:none}
.toast{position:fixed;inset-inline:16px;bottom:96px;z-index:60;max-width:520px;margin:0 auto;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;text-align:center;font-weight:700;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(22,50,79,.55);display:grid;place-items:center;padding:18px}
.modal .box{background:#fff;border-radius:26px;padding:22px 18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.petal{position:fixed;top:-20px;z-index:70;pointer-events:none;font-size:26px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat-grid b{display:block;font-size:1.5rem;line-height:1.3}
.stat-grid span{font-size:.88rem;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);justify-content:center;margin-top:8px}
.ayrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px 4px}
.ayrow .pl{width:34px;height:48px;flex:none}
.ayrow .tx{font-family:var(--quran);font-size:1.45rem;line-height:1.9;direction:rtl;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ayrow .no{width:32px;color:var(--muted);font-weight:800;text-align:center}
a{color:var(--leaf-d);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:480px){.opts.words{grid-template-columns:repeat(4,1fr)}}

/* تصویر آیه: صفحهٔ کاغذی هم‌رنگ پس‌زمینهٔ خود تصویر، تا لبهٔ تصویر دیده نشود */
.ayah.has-img{background:var(--paper,#fff);border-radius:18px;padding:12px;box-shadow:0 0 0 1px var(--line);line-height:0}
.ayah.has-img img{display:block;margin:0 auto;max-width:100%;height:auto}
.ayah.has-img.blend img{mix-blend-mode:multiply}

/* جای خالی: همه یک‌شکل و هم‌عرض (طول کلمه سرنخ نشود)؛ جای خالیِ فعال فقط زردرنگ و پررنگ‌تر است */
.ayah:not(#rec) .w.hide{display:inline-block;width:3.1em;height:1.35em;overflow:hidden;vertical-align:middle;margin:0 .2em;border-radius:8px 8px 4px 4px;
  background:none;border-bottom:5px dashed #aacdc0}
.ayah:not(#rec) .w.hide.hl{background:#fff3c4;border-bottom:5px solid var(--gold)}
.ar-sub{display:block;font-family:var(--quran);font-weight:400;font-size:1.3rem;color:var(--muted);line-height:1.6}

/* باغ طبیعی صفحهٔ امروز */
.garden.wild{display:block;padding:0;margin-top:34px}
.garden .spot{position:absolute;display:block;transform-origin:50% 100%}
.garden .deco{position:absolute;display:block;pointer-events:none;z-index:0}
.garden .tuft{width:20px;height:12px;opacity:.85}
.garden .pebble{width:11px;height:6px;border-radius:50%;background:#c9c1b3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.garden .bloom{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 85% 70%);box-shadow:0 0 0 2.5px #ffd45e inset,0 3px 0 -1px #2f8f5b}
.butterfly{position:absolute;top:-6px;inset-inline-start:22%;font-size:20px;z-index:999;pointer-events:none;animation:flutter 7s ease-in-out infinite}
@keyframes flutter{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(70px,16px) rotate(10deg)}50%{transform:translate(150px,-4px) rotate(-6deg)}75%{transform:translate(80px,26px) rotate(12deg)}100%{transform:translate(0,0) rotate(-8deg)}}

/* مزرعه (باغ من) */
.farm{position:relative;border-radius:28px;padding:18px 10px 26px;overflow:hidden;
  background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.16) 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 70% 64%,rgba(0,0,0,.05) 0 2px,transparent 3px) 0 0/46px 46px,linear-gradient(#bfe6a8,#9fd48b 40%,#8ccb7e);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 10px 26px -16px rgba(22,50,79,.55)}
.field{position:relative;display:flex;flex-direction:column;gap:6px}
.field:before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:50%;width:14px;margin-inline-start:-7px;border-radius:99px;
  background:repeating-linear-gradient(#e7d6b3 0 14px,#d9c49a 14px 18px);opacity:.75}
.frow{position:relative;display:flex;align-items:center;gap:6px}
.frow.l{flex-direction:row}.frow.r{flex-direction:row-reverse}
.frow.full,.frow.band{justify-content:center}
.frow.band{gap:14px;padding:4px 0}
.decor{flex:1;display:grid;place-items:center;min-width:0}
.decor svg{width:min(70px,100%);height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
.decor.pond svg{width:min(120px,100%)}
.bed{position:relative;display:flex;flex-direction:column;text-align:start;flex:none;z-index:1}
.bed.sm{width:58%}.bed.md{width:76%}.bed.lg{width:100%}
.bed .sign{position:relative;z-index:3;align-self:center;display:flex;align-items:center;gap:8px;margin-bottom:-14px;padding:6px 12px 6px 10px;border-radius:12px;
  background:linear-gradient(#d8a96c,#bd8a4f);color:#fff9ea;box-shadow:0 3px 0 #8d6234,0 7px 12px -6px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.bed .sign:before,.bed .sign:after{content:"";position:absolute;top:-9px;width:3px;height:11px;background:#7a5230;border-radius:2px}
.bed .sign:before{inset-inline-start:16px}.bed .sign:after{inset-inline-end:16px}
.bed .sign .no{min-width:32px;height:32px;padding:0 4px;border-radius:10px;display:grid;place-items:center;background:var(--c,#2a8f58);font-weight:800;font-size:.95rem;text-shadow:none}
.bed .nmx b{display:block;font-size:1.05rem;line-height:1.25}
.bed .nmx .ar{display:block;font-family:var(--quran);font-style:normal;font-size:1rem;line-height:1.4;opacity:.92}
.bed .sign .medal{font-size:1.25rem}
.bed .flag{position:absolute;top:-24px;inset-inline-end:-6px;background:var(--gold);color:#4a3200;border-radius:99px;font-size:.78rem;font-weight:800;padding:0 10px;text-shadow:none;animation:bob 2s ease-in-out infinite;box-shadow:0 2px 0 #c98a0f}
.bed .soil{position:relative;z-index:1;border-radius:18px;padding:22px 8px 8px;border:6px solid #b98853;
  background:repeating-linear-gradient(0deg,#7d5236 0 11px,#8a5c3c 11px 22px);box-shadow:inset 0 6px 14px rgba(0,0,0,.28),0 5px 0 #8d6234,0 10px 16px -8px rgba(0,0,0,.4)}
.bed .crops{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 0}
.bed .crops .plant{filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.bed .foot{position:relative;z-index:2;margin:10px 6px 0;display:flex;flex-direction:column}
.bed .foot .bar{background:rgba(255,255,255,.55);height:9px;margin-top:0}
.bed .foot .meta{font-size:.85rem;color:#264d33;font-weight:700;margin-top:2px}
.bed.next .soil{border-color:var(--gold);box-shadow:inset 0 6px 14px rgba(0,0,0,.28),0 0 0 4px rgba(242,177,52,.45),0 0 26px rgba(242,177,52,.75)}
.bed:active .soil{transform:translateY(2px)}
@media (min-width:480px){.bed.sm{width:50%}.bed.md{width:66%}}

.frow.pair{align-items:flex-start;gap:8px}
.frow.pair .bed.half{width:calc(50% - 4px)}
.frow.pair .decor{align-self:center}
.bed .sign{max-width:100%;padding:5px 8px 5px 7px;gap:6px}
.bed .nmx b{font-size:1rem}
.bed .sign .no{min-width:28px;height:28px;font-size:.85rem}
.bed .soil{padding:20px 4px 6px;border-width:5px}
.bed .crops{align-items:flex-end;gap:0}
.plant.flat{height:calc(var(--pw,44px)*.4)}
.plant.flat svg{height:100%}
.bed .crops .plant:not(.flat){margin-top:-4px}
.bed.lg .soil{padding-inline:8px}
.farm{padding-top:34px}

/* حالت آزمایشی */
#demobar{position:fixed;top:0;inset-inline:0;z-index:45;display:flex;gap:8px;align-items:center;padding:5px 10px;background:#fff3c4;color:#4a3200;border-bottom:2px solid var(--gold);font-weight:800}
#demobar span{flex:1;text-align:center;font-size:.9rem}
#demobar button{background:#fff;border-radius:99px;padding:1px 12px;font-weight:800;font-size:.88rem;box-shadow:0 0 0 2px var(--gold)}
body.demo #app{padding-top:38px}
select{font:inherit;width:100%;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}

/* جلوگیری از نشت المان‌های باغ روی پنجره‌ها و نوار آزمایشی */
.scene,.garden.wild,.farm{isolation:isolate}
main{position:relative;z-index:0}

/* تمرین‌ها و بازی‌ها */
.ayah .w.tap{cursor:pointer}.ayah .w.tap.no{background:#fde4e2;animation:shake .35s}
.ayah .w.tip{outline:3px dashed var(--gold);outline-offset:2px}
.ayah .w.good{background:#dff5e7}
.ayah .w.hint{color:var(--leaf-d);cursor:pointer;background:#eef8f2}
.pz-board{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;direction:rtl}
.pz-slot{min-width:84px;min-height:58px;padding:2px 12px;border-radius:16px;border:3px dashed var(--line);background:#fff;font-family:var(--quran);font-size:calc(1.6rem*var(--fs));line-height:2;color:var(--muted);direction:rtl}
.pz-slot.full{border:3px solid #7cc79b;background:#e9f8ef;color:var(--ink,#16324f)}
.pz-slot.no,.pz-piece.no{animation:shake .35s;background:#fde4e2}
.pz-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.pz-piece{padding:2px 14px;border-radius:16px;background:hsl(var(--h),70%,92%);box-shadow:0 0 0 2px hsl(var(--h),50%,70%),0 4px 0 hsl(var(--h),50%,70%);font-family:var(--quran);font-size:calc(1.6rem*var(--fs));line-height:2;direction:rtl;touch-action:none}
.pz-piece.sel{transform:translateY(-3px) scale(1.05);box-shadow:0 0 0 3px var(--gold),0 6px 0 var(--gold)}
.pz-piece.drag{position:fixed;z-index:70;pointer-events:none;opacity:.92;transform:scale(1.08)}
.built{min-height:56px;text-align:center;padding:8px}
.bubbles{position:relative;height:300px;margin-top:10px;border-radius:24px;background:linear-gradient(#e3f6fb,#f3fbf7);overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-50%);min-width:84px;min-height:84px;max-width:44%;padding:8px 14px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0 12%,hsla(var(--h),80%,85%,.9) 13%,hsla(var(--h),70%,72%,.85));box-shadow:inset 0 0 0 2px hsla(var(--h),60%,55%,.5);font-family:var(--quran);font-size:calc(1.5rem*var(--fs));line-height:1.6;animation:bob var(--dur) ease-in-out infinite}
.bubble.pop{animation:none;transform:translate(-50%,-50%) scale(1.5);opacity:0;transition:.18s}
.bubble.no{box-shadow:inset 0 0 0 3px #e0574f}
@keyframes bob{50%{margin-top:-9px}}
.mem{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.mc{min-height:76px;padding:6px 10px;border-radius:16px;background:#d9f0e2;font-size:1.6rem;box-shadow:0 4px 0 #a9d6bb}
.mc.up{background:#fff;font-family:var(--quran);font-size:calc(1.35rem*var(--fs));line-height:1.9;box-shadow:0 0 0 2px var(--line);direction:rtl}
.mc.match{background:#e9f8ef;box-shadow:0 0 0 2px #7cc79b}
.seq-slots,.seq-bank{display:grid;gap:8px;margin:10px 0}
.seq-slot{display:flex;gap:10px;align-items:center;min-height:52px;padding:6px 12px;border-radius:14px;border:3px dashed var(--line);background:#fff}
.seq-slot.full{border:3px solid #7cc79b;background:#e9f8ef}
.seq-slot b{color:var(--muted)}.seq-slot span{font-family:var(--quran);font-size:calc(1.35rem*var(--fs));line-height:1.9;direction:rtl}
.seq-card{padding:8px 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);font-family:var(--quran);font-size:calc(1.35rem*var(--fs));line-height:1.9;direction:rtl;text-align:right}
.seq-card.no{animation:shake .35s;background:#fde4e2}
.gcard{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin:0 0 12px;border-radius:22px;text-align:start;background:hsl(var(--gh),70%,95%);box-shadow:0 0 0 2px hsl(var(--gh),55%,80%),0 5px 0 hsl(var(--gh),50%,78%)}
.gcard:disabled{opacity:.55;filter:grayscale(.5)}
.gcard .gem{font-size:2.3rem}.gcard .gtx{flex:1;display:grid}.gcard small{color:var(--muted);font-weight:500}.gcard .go{font-size:1.8rem;color:var(--muted)}
.sidegames{display:grid;gap:6px}.sidegames .row{flex-wrap:wrap}

[hidden]{display:none!important}
</style>

صورت درهای متعدد درمی‌آید؛"],["وَسُيِّرَتِ ٱلْجِبَالُ فَكَانَتْ سَرَابًا","و کوه‌ها به حرکت درمی‌آید و به صورت سرابی می‌شود؛"],["إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا","و بی‌گمان، جهنم کمینگاهی است"],["لِّلطَّٰغِينَ مَـَٔابًا","[و] محل بازگشتی برای طغیانگران."],["لَّٰبِثِينَ فِيهَآ أَحْقَابًا","مدت زمانی بی‌پایان در آنجا می‌مانند."],["لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا","در آنجا نه [چیز] خنکی می‌چشند و نه آشامیدنی [گوارایی خواهند داشت]."],["إِلَّا حَمِيمًا وَغَسَّاقًا","جز آبی سوزان و [مایعی که] چرک و خون [جهنمیان است]."],["جَزَآءً وِفَاقًا","[این] کیفری است مناسب و درخور [گناهانشان]؛"],["إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًا","همانا آنان از حساب [و کتاب روز قیامت] نمی‌ترسیدند"],["وَكَذَّبُوا۟ بِـَٔايَٰتِنَا كِذَّابًا","و آیات ما را به شدت تکذیب کردند؛"],["وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ كِتَٰبًا","و ما همه چیز را [در لوح محفوظ] شمارش و ثبت کرده‌ایم."],["فَذُوقُوا۟ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا","پس [کیفرِ اعمال خود را] بچشید که [چیزی] جز عذاب بر شما نمی‌افزاییم."],["إِنَّ لِلْمُتَّقِينَ مَفَازًا","بی‌گمان، برای پرهیزگاران کامیابی [بزرگی] است."],["حَدَآئِقَ وَأَعْنَٰبًا","باغ‌های [میوه] و تاکستان‌ها."],["وَكَوَاعِبَ أَتْرَابًا","و حوریانی نوجوان و هم‌سن و سال."],["وَكَأْسًا دِهَاقًا","و جام‌هایی لبریز و پیاپی [از شراب پاکیزۀ بهشت]."],["لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّٰبًا","در آنجا نه سخن بیهوده‌ای می‌شنوند و نه دروغی."],["جَزَآءً مِّن رَّبِّكَ عَطَآءً حِسَابًا","[این] پاداش، از جانب پروردگار توست، و عطایی از روی حساب"],["رَّبِّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ٱلرَّحْمَٰنِ لَا يَمْلِكُونَ مِنْهُ خِطَابًا","[همان] پروردگار آسمان‌ها و زمین و آنچه در میان آنهاست؛ [همان الله] رحمان [که] هیچ‌ کس [در آن روز] یارای سخن گفتن با او را ندارد."],["يَوْمَ يَقُومُ ٱلرُّوحُ وَٱلْمَلَٰٓئِكَةُ صَفًّا لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَٰنُ وَقَالَ صَوَابًا","روزی ‌که روح [= جبرئیل] و فرشتگان به صف می‌ایستند، [و] هیچ‌ کس سخن نمی‌گوید، جز کسی ‌که [الله] رحمان به او اجازه داده باشد و [او] سخن درست [و صواب] گوید."],["ذَٰلِكَ ٱلْيَوْمُ ٱلْحَقُّ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔابًا","آن [روز]، روزِ حق است [و بدون تردید واقع می‌شود]؛ پس هر کس كه بخواهد، [می‌تواند] راه بازگشتى به سوى پروردگار خود بجوید."],["إِنَّآ أَنذَرْنَٰكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ ٱلْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ ٱلْكَافِرُ يَٰلَيْتَنِى كُنتُ تُرَٰبًۢا","به راستی، ما شما را از عذابی نزدیک بیم دادیم: روزی ‌که انسان آنچه را از قبل با دست‌های خود فرستاده است می‌بیند، و کافر می‌گوید: «ای کاش من خاک بودم [و برای حساب برانگیخته نمی‌شدم»]!"]]},{"id":79,"ar":"النازعات","fa":"نازعات","v":[["وَٱلنَّٰزِعَٰتِ غَرْقًا","سوگند به فرشتگانی که جان [کافران] را به شدت بیرون می‌کشند."],["وَٱلنَّٰشِطَٰتِ نَشْطًا","و سوگند به فرشتگانی که جان [مؤمنان] را به نرمی و آسانی می‌گیرند."],["وَٱلسَّٰبِحَٰتِ سَبْحًا","و سوگند به فرشتگانی که [به امرِ الله، از آسمان به سوی زمین و بالعکس] شناورند."],["فَٱلسَّٰبِقَٰتِ سَبْقًا","و سوگند به فرشتگانی که [در اجرای اوامر الهی] بر یکدیگر سبقت می‌گیرند."],["فَٱلْمُدَبِّرَٰتِ أَمْرًا","و سوگند به فرشتگانی [که به امر الهی] کار‌‌ها را تدبیر می‌کنند."],["يَوْمَ تَرْجُفُ ٱلرَّاجِفَةُ","روزی‌ که [پس از اولین دمیدن در صور] زمین [و کوه‌ها و همه چیز] به لرزه درآید"],["تَتْبَعُهَا ٱلرَّادِفَةُ","[و] در پی آن، [دمیدن دوم حشر] بیاید،"],["قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ","در آن روز، دل‌هایی سخت مضطرب [و ترسان] هستند."],["أَبْصَٰرُهَا خَٰشِعَةٌ","و چشم‌های آنان [از ترس و شرمساری] فرو افتاده است."],["يَقُولُونَ أَءِنَّا لَمَرْدُودُونَ فِى ٱلْحَافِرَةِ","[کافران در دنیا] می‌گفتند: «آیا ما [پس از مرگ، دوباره] به حال اول خود باز‌گردانده می‌شویم؟"],["أَءِذَا كُنَّا عِظَٰمًا نَّخِرَةً","آیا هنگامی‌ که استخوان‌هایی پوسیده شدیم [و به خاک تبدیل گشتیم، باز هم زنده می‌شویم]»؟"],["قَالُوا۟ تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ","می‌گفتند: «[اگر چنین وعده‌ای درست باشد،] آنگاه آن بازگشتی زیانبار است»."],["فَإِنَّمَا هِىَ زَجْرَةٌ وَٰحِدَةٌ","آن [بازگشت،] تنها [به] یک بانگِ مهیب است [و بس]."],["فَإِذَا هُم بِٱلسَّاهِرَةِ","و ناگهان همگی بر عرصۀ زمین [محشر] ظاهر می‌شوند."],["هَلْ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ","[ای پیامبر،] آیا داستان موسی به تو رسیده است؟"],["إِذْ نَادَىٰهُ رَبُّهُۥ بِٱلْوَادِ ٱلْمُقَدَّسِ طُوًى","آنگاه که پروردگارش او را در سرزمین مقدس «طُوی» ندا داد [و فرمود:]"],["ٱذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغَىٰ","«به سوی فرعون برو که او طغیان کرده است،"],["فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ","و به او بگو: «آیا می‌خواهی [از کفر و گناه] پاک شوی؟"],["وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ","و من تو را به سوی پروردگارت هدایت کنم تا [از او] بترسی [و فرمانبردار شوی]؟"],["فَأَرَىٰهُ ٱلْـَٔايَةَ ٱلْكُبْرَىٰ","پس [موسی] معجزۀ بزرگ را به او نشان داد."],["فَكَذَّبَ وَعَصَىٰ","اما او تکذیب و سرکشی کرد."],["ثُمَّ أَدْبَرَ يَسْعَىٰ","سپس [به حق] پشت کرد و به کوشش و تلاش [علیه موسی] پرداخت."],["فَحَشَرَ فَنَادَىٰ","آنگاه [قومش را] جمع کرد و ندا داد"],["فَقَالَ أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ","و گفت: «من پروردگارِ برتر شما هستم»."],["فَأَخَذَهُ ٱللَّهُ نَكَالَ ٱلْـَٔاخِرَةِ وَٱلْأُولَىٰٓ","الله او را به عذاب آخرت و دنیا گرفتار کرد."],["إِنَّ فِى ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰٓ","بی‌گمان، در این [واقعه،] برای هر کس ‌که [از الله] می‌ترسد، عبرتی است."],["ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ بَنَىٰهَا","آیا آفرینش شما [بعد از مرگ] سخت‌تر است یا آسمانی که [الله] آن را بنا کرد؟"],["رَفَعَ سَمْكَهَا فَسَوَّىٰهَا","سقف آن را بر افراشت و به آن شکل و نظم داد،"],["وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا","و شبش را تاریک و روزش را روشن گردانید،"],["وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ","و زمین را بعد از آن گسترانید،"],["أَخْرَجَ مِنْهَا مَآءَهَا وَمَرْعَىٰهَا","و از آن، آب [چشمه‌ها و چاه‌ها و] چراگاهش را بیرون آورد،"],["وَٱلْجِبَالَ أَرْسَىٰهَا","و کوه‌ها را محکم و استوار [بر روی زمین] قرار داد."],["مَتَٰعًا لَّكُمْ وَلِأَنْعَٰمِكُمْ","[همۀ اینها] برای بهره‌گیری شما و چهارپایانتان است."],["فَإِذَا جَآءَتِ ٱلطَّآمَّةُ ٱلْكُبْرَىٰ","هنگامی‌ که [آن] حادثۀ بزرگ [قیامت] فرا رسد،"],["يَوْمَ يَتَذَكَّرُ ٱلْإِنسَٰنُ مَا سَعَىٰ","در آن روز، انسان [تمام اعمال و] تلاش‌های خود را به یاد می‌آورد."],["وَبُرِّزَتِ ٱلْجَحِيمُ لِمَن يَرَىٰ","و جهنم برای هر بیننده‌ای آشکار می‌شود."],["فَأَمَّا مَن طَغَىٰ","اما آن کس که طغیان [و سرکشی] کرده باشد"],["وَءَاثَرَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","و زندگی دنیا را [بر آخرت] ترجیح داده باشد،"],["فَإِنَّ ٱلْجَحِيمَ هِىَ ٱلْمَأْوَىٰ","بی‌تردید، جهنم جایگاه اوست."],["وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ","و اما کسی‌ که از ایستادن در حضور پروردگارش بیمناک بوده و نفس را از هوی [و هوس] بازداشته باشد،"],["فَإِنَّ ٱلْجَنَّةَ هِىَ ٱلْمَأْوَىٰ","قطعاً بهشت جایگاه اوست."],["يَسْـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرْسَىٰهَا","[ای پیامبر،] دربارۀ قیامت از تو می‌پرسند که در چه زمانی واقع می‌شود؟"],["فِيمَ أَنتَ مِن ذِكْرَىٰهَآ","تو را با یادآوری این سخن چه کار است؟"],["إِلَىٰ رَبِّكَ مُنتَهَىٰهَآ","[سرانجام و] منتهای [علمِ] آن، نزد پروردگار توست."],["إِنَّمَآ أَنتَ مُنذِرُ مَن يَخْشَىٰهَا","تو فقط بیم‌دهندۀ کسانی هستی که از آن [= قیامت] می‌ترسند."],["كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓا۟ إِلَّا عَشِيَّةً أَوْ ضُحَىٰهَا","روزی‌ که [کافران] قیامت را ببینند، [چنین احساس می‌کنند که] گویی [در دنیا] جز یک شامگاه یا بامداد به سر نبرده‌اند."]]},{"id":80,"ar":"عبس","fa":"عبس","v":[["عَبَسَ وَتَوَلَّىٰٓ","[پیامبر] چهره در هم کشید و روی برگردانْد"],["أَن جَآءَهُ ٱلْأَعْمَىٰ","از اینکه آن نابینا [= عبدالله بن اُمّ مَکتوم] نزدش آمد."],["وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ","و [ای پیامبر،] تو چه می‌دانی؟ چه بسا او [از گناهانش] پاک ‌شود،"],["أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ","یا پند گیرد و این پند به سودش باشد."],["أَمَّا مَنِ ٱسْتَغْنَىٰ","اما آن کس که [از ایمان] بی‌نیازی می‌ورزد"],["فَأَنتَ لَهُۥ تَصَدَّىٰ","تو به او روی می‌آوری؛"],["وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ","در حالی که اگر او خود را [از کفر] پاک نسازد، ایرادی بر تو نیست؛"],["وَأَمَّا مَن جَآءَكَ يَسْعَىٰ","اما کسی که شتابان به سراغ تو می‌آید"],["وَهُوَ يَخْشَىٰ","و [از الله] می‌ترسد،"],["فَأَنتَ عَنْهُ تَلَهَّىٰ","تو از او غافل می‌شوی [و به دیگران می‌پردازی]."],["كَلَّآ إِنَّهَا تَذْكِرَةٌ","هرگز چنین نیست؛ بی‌گمان، این [آیات برای] تذکر و یادآوری است."],["فَمَن شَآءَ ذَكَرَهُۥ","پس هر کس که بخواهد، [می‌تواند] از آن پند گیرد."],["فِى صُحُفٍ مُّكَرَّمَةٍ","در صحیفه‌های ارجمندی [ثبت] است."],["مَّرْفُوعَةٍ مُّطَهَّرَةٍۭ","[در جایگاهی] بلندپایه و پاکیزه [از پلیدی]"],["بِأَيْدِى سَفَرَةٍ","در دست سفیران [وحی] است"],["كِرَامٍۭ بَرَرَةٍ","[که] بزرگوار و نیکوکارند."],["قُتِلَ ٱلْإِنسَٰنُ مَآ أَكْفَرَهُۥ","مرگ بر انسان [کافر، که] چقدر ناسپاس است!"],["مِنْ أَىِّ شَىْءٍ خَلَقَهُۥ","[الله] او را از چه چیز آفریده است؟"],["مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ","او را از نطفۀ [ناچیزی] آفرید، سپس او را موزون ساخت."],["ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ","سپس راه را برایش آسان نمود."],["ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥ","آنگاه [پس از پایان عمر،] او را میرانْد و در قبر [پنهان] نمود."],["ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ","سپس هر گاه بخواهد، او را [زنده می‌کند و] برمی‌انگیزد."],["كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ","هرگز چنین نیست [که او می‌پندارد]. او هنوز آنچه را که [الله] فرمان داده به جای نیاورده است."],["فَلْيَنظُرِ ٱلْإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ","انسان باید به غذای خویش [و آفرینشِ آن] بنگرد:"],["أَنَّا صَبَبْنَا ٱلْمَآءَ صَبًّا","ما آب فراوان [از آسمان] فروریختیم،"],["ثُمَّ شَقَقْنَا ٱلْأَرْضَ شَقًّا","سپس زمین را از هم شکافتیم،"],["فَأَنۢبَتْنَا فِيهَا حَبًّا","آنگاه دانه‌[های فراون] در آن رویاندیم،"],["وَعِنَبًا وَقَضْبًا","و انگور و سبزی [خوراکی بسیار]،"],["وَزَيْتُونًا وَنَخْلًا","و زیتون و نخل،"],["وَحَدَآئِقَ غُلْبًا","و باغ‌هایی [انبوه و] پردرخت،"],["وَفَٰكِهَةً وَأَبًّا","و [انواع] میوه و علوفه [پدید آوردیم]."],["مَّتَٰعًا لَّكُمْ وَلِأَنْعَٰمِكُمْ","[همۀ اینها] برای بهره‌گیری شما و چهارپایانتان است."],["فَإِذَا جَآءَتِ ٱلصَّآخَّةُ","هنگامی ‌که [آن] صدای مهیب [قیامت] فرارسد،"],["يَوْمَ يَفِرُّ ٱلْمَرْءُ مِنْ أَخِيهِ","روزی ‌که انسان از برادرش می‌گریزد"],["وَأُمِّهِۦ وَأَبِيهِ","و از مادرش و از پدرش"],["وَصَٰحِبَتِهِۦ وَبَنِيهِ","و از زنش و پسرانش [نیز می‌گریزد]،"],["لِكُلِّ ٱمْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ","در آن روز، هر کس را کاری است که او را به خودش سرگرم می‌دارد [و از دیگری بازمی‌دارد]."],["وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ","چهره‌هایی در آن روز، گشاده و روشن است."],["ضَاحِكَةٌ مُّسْتَبْشِرَةٌ","[به خاطر نعمت و رحمتِ الله] خندان [و] شاد است."],["وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ","و چهره‌هایی در آن روز، غبارآلود است."],["تَرْهَقُهَا قَتَرَةٌ","[و] سیاهی [و تاریکی] آنها را پوشانده است."],["أُو۟لَٰٓئِكَ هُمُ ٱلْكَفَرَةُ ٱلْفَجَرَةُ","اینان همان کافرانِ بدکردارند."]]},{"id":81,"ar":"التكوير","fa":"تکویر","v":[["إِذَا ٱلشَّمْسُ كُوِّرَتْ","آنگاه ‌که خورشید درهم پیچیده [و تاریک] گردد،"],["وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ","و آنگاه ‌که ستارگان بی‌فروغ شوند،"],["وَإِذَا ٱلْجِبَالُ سُيِّرَتْ","و آنگاه ‌که کوه‌ها به حرکت درآید،"],["وَإِذَا ٱلْعِشَارُ عُطِّلَتْ","و آنگاه ‌که ماده‌شترانِ باردار رها شوند،"],["وَإِذَا ٱلْوُحُوشُ حُشِرَتْ","و آنگاه ‌که حیوانات وحشی [در کنار انسان] گرد آورده شوند،"],["وَإِذَا ٱلْبِحَارُ سُجِّرَتْ","و آنگاه ‌که دریا‌ها [جوشان و] برافروخته شود،"],["وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ","و آنگاه ‌که هر کس با همسانِ خود قرین گردد،"],["وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ","و آنگاه ‌که از دختر زنده‌به‌گورشده پرسیده شود"],["بِأَىِّ ذَنۢبٍ قُتِلَتْ","[که] به کدامین گناه کشته شده است،"],["وَإِذَا ٱلصُّحُفُ نُشِرَتْ","و آنگاه ‌که نامه‌های [اعمال] گشوده شود،"],["وَإِذَا ٱلسَّمَآءُ كُشِطَتْ","و آنگاه ‌که پرده از روی آسمان برگرفته شود،"],["وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ","و آنگاه ‌که دوزخ، افروخته [و شعله‌ور] گردد،"],["وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ","و آنگاه ‌که بهشت [برای پرواپیشگان] نزدیک آورده شود."],["عَلِمَتْ نَفْسٌ مَّآ أَحْضَرَتْ","[در آن هنگام،] هر کس خواهد دانست که چه چیزی [برای آخرت خود] آماده کرده است."],["فَلَآ أُقْسِمُ بِٱلْخُنَّسِ","سوگند به ستارگانی که [به جایگاه خود] بازمی‌گردند،"],["ٱلْجَوَارِ ٱلْكُنَّسِ","[شتابان] حرکت می‌کنند [و از نظر] پنهان می‌شوند؛"],["وَٱلَّيْلِ إِذَا عَسْعَسَ","و سوگند به شب، هنگامی ‌که [از تاریکی‌اش کاسته شود و] پشت کند؛"],["وَٱلصُّبْحِ إِذَا تَنَفَّسَ","و سوگند به صبح، هنگامی که بدمد؛"],["إِنَّهُۥ لَقَوْلُ رَسُولٍ كَرِيمٍ","بی‌تردید، این [قرآن،] سخن [الله است که ابلاغش به پیامبر، بر عهدۀ] فرستاده‌ای بزرگوار [= جبرئیل] است."],["ذِى قُوَّةٍ عِندَ ذِى ٱلْعَرْشِ مَكِينٍ","[همان فرشته‌ای] که [مقتدر و] نیرومند است و نزد [اللهِ] صاحب‌عرش، مقام والایی دارد؛"],["مُّطَاعٍ ثَمَّ أَمِينٍ","[در ملکوت اعلی و عالم فرشتگان] از او فرمان می‌برند و امین [وحی] است."],["وَمَا صَاحِبُكُم بِمَجْنُونٍ","[ای مردم،] همنشین شما [= محمد] دیوانه نیست؛"],["وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ","و بی‌تردید، [محمد]، او [= جبرئیل] را در افق روشن دیده است."],["وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍ","و او بر [ابلاغِ آنچه از طریق] غیب [به وی وحی می‌گردد] بخیل نیست [و همانند کاهنان نیز مزد نمی‌گیرد]."],["وَمَا هُوَ بِقَوْلِ شَيْطَٰنٍ رَّجِيمٍ","و این [قرآن] گفتۀ شیطان رانده‌شده نیست."],["فَأَيْنَ تَذْهَبُونَ","پس به کجا می‌روید؟"],["إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَٰلَمِينَ","این [قرآن] چیزی جز پند و اندرز برای جهانیان نیست."],["لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ","برای هر یک از شما که بخواهد راه راست [حق را] در پیش گیرد."],["وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ","و شما [چیزی را] نمی‌خواهید، مگر آنکه پروردگار جهانیان [اراده کند و] بخواهد."]]},{"id":82,"ar":"الإنفطار","fa":"انفطار","v":[["إِذَا ٱلسَّمَآءُ ٱنفَطَرَتْ","آنگاه ‌که آسمان شکافته شود،"],["وَإِذَا ٱلْكَوَاكِبُ ٱنتَثَرَتْ","آنگاه ‌که ستارگان پراکنده شوند [و فرو ریزند]،"],["وَإِذَا ٱلْبِحَارُ فُجِّرَتْ","و آنگاه ‌که دریا‌ها [به هم آمیزند و لبریز و] روان گردند،"],["وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ","و آنگاه ‌که قبرها [برای براگیختن مردگان] زیر و رو شود،"],["عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ","[در آن هنگام،] هر کس می‌داند چه چیزهایی را پیشاپیش فرستاده و چه چیزهایی را واپس نهاده [و بر جای گذاشته است]."],["يَٰٓأَيُّهَا ٱلْإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ","ای انسان، چه چیزی تو را [نسبت] به پروردگار بزرگوارت مغرور ساخته است؟"],["ٱلَّذِى خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ","آن [پروردگاری] که تو را آفرید، سپس به تو سر و سامان داد و آنگاه تو را متعادل و متناسب کرد."],["فِىٓ أَىِّ صُورَةٍ مَّا شَآءَ رَكَّبَكَ","و به هر شکلی [و صورتی] که خواست، تو را ترکیب نمود."],["كَلَّا بَلْ تُكَذِّبُونَ بِٱلدِّينِ","هرگز چنین نیست [که شما گمان می‌کنید]؛ بلکه شما [روز] جزا را تکذیب می‌کنید."],["وَإِنَّ عَلَيْكُمْ لَحَٰفِظِينَ","و بی‌گمان، نگهبانانی [از فرشتگان] بر شما گمارده شده‌اند."],["كِرَامًا كَٰتِبِينَ","که نویسندگانی بزرگوارند؛"],["يَعْلَمُونَ مَا تَفْعَلُونَ","آنچه را انجام می‌دهید، می‌دانند [و اعمال نیک و بد شما را ثبت می‌کنند]."],["إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ","مسلماً نیکوکاران در نعمت[های بهشت] هستند."],["وَإِنَّ ٱلْفُجَّارَ لَفِى جَحِيمٍ","و یقیناً بدکاران در [آتش] جهنمند."],["يَصْلَوْنَهَا يَوْمَ ٱلدِّينِ","روز جزا به آن درمی‌آیند [و می‌سوزند]"],["وَمَا هُمْ عَنْهَا بِغَآئِبِينَ","و هرگز آنان از آنجا به دور و [در امان] نباشند."],["وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ","و تو چه ‌دانی که روز جزا چیست؟"],["ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ","باز تو چه می‌دانی که روز جزا چیست؟"],["يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْـًٔا وَٱلْأَمْرُ يَوْمَئِذٍ لِّلَّهِ","روزی‌که هیچ کس قادر به انجام کاری برای دیگری نیست؛ و در آن روز، حکم [و فرمان،] از آنِ الله است."]]},{"id":83,"ar":"المطففين","fa":"مطففین","v":[["وَيْلٌ لِّلْمُطَفِّفِينَ","وای بر کم‌فروشان!"],["ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ","[همان] کسانی‌ که چون [برای خود] از مردم پیمانه می‌کنند، حق خود را کامل می‌گیرند،"],["وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ","و هنگامی ‌که [می‌خواهند] برای آنان پیمانه یا وزن کنند، کم می‌گذارند."],["أَلَا يَظُنُّ أُو۟لَٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ","آیا آنها گمان نمی‌کنند که [قیامت فرا می‌رسد و از قبرها] برانگیخته می‌شوند،"],["لِيَوْمٍ عَظِيمٍ","در روزی بزرگ؟"],["يَوْمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلْعَٰلَمِينَ","[همان] روزی‌ که مردم در پیشگاه پروردگار جهانیان می‌ایستند."],["كَلَّآ إِنَّ كِتَٰبَ ٱلْفُجَّارِ لَفِى سِجِّينٍ","هرگز چنین نیست [که کافران پنداشته‌اند]! به راستی که نامۀ [اعمال] بدکاران در سِجّین است."],["وَمَآ أَدْرَىٰكَ مَا سِجِّينٌ","و تو چه دانی که سِجّین چیست؟"],["كِتَٰبٌ مَّرْقُومٌ","کتابی است که [اعمال بدکاران در آن] نوشته شده است."],["وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","در آن روز، وای بر تکذیب‌کنندگان!"],["ٱلَّذِينَ يُكَذِّبُونَ بِيَوْمِ ٱلدِّينِ","همان کسانی که روز جزا را [انکار و] تکذیب می‌کنند؛"],["وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ","و جز ستمکارانِ گنهکار، [کسی] آن [روز] را تکذیب نمی‌کند."],["إِذَا تُتْلَىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلْأَوَّلِينَ","هنگامی که آیات ما بر او تلاوت می‌شود، می‌گوید: «[این] افسانه‌های [خیالی] گذشتگان است»."],["كَلَّا بَلْ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ","هرگز چنین نیست [که آنها گمان می‌کنند]؛ بلکه [به سبب] آنچه کرده‌اند، بر دل‌هایشان زنگار بسته است."],["كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ","هرگز چنین نیست [که آنها می‌پندارند]. بی‌گمان، آنان در آن روز از [دیدار] پروردگار‌شان محرومند."],["ثُمَّ إِنَّهُمْ لَصَالُوا۟ ٱلْجَحِيمِ","و [بعد از حساب،] مسلماً وارد دوزخ می‌شوند."],["ثُمَّ يُقَالُ هَٰذَا ٱلَّذِى كُنتُم بِهِۦ تُكَذِّبُونَ","آنگاه به آنان گفته می‌شود: «این [آتش،] همان چیزی است که آن را تکذیب می‌کردید»."],["كَلَّآ إِنَّ كِتَٰبَ ٱلْأَبْرَارِ لَفِى عِلِّيِّينَ","هرگز چنین نیست [که آنها می‌پندارند]؛ بی‌گمان، نامۀ [اعمال] نیکوکاران در «عِلّیین» است."],["وَمَآ أَدْرَىٰكَ مَا عِلِّيُّونَ","و تو چه دانی که «عِلّیین» چیست؟"],["كِتَٰبٌ مَّرْقُومٌ","کتابی است که [اعمال نیکوکاران در آن] نوشته شده است،"],["يَشْهَدُهُ ٱلْمُقَرَّبُونَ","که مقرّبان [درگاه الهی] بر آن حاضر می‌شوند [و گواهی می‌دهند]."],["إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ","همانا نیکوکاران در نعمت[های بهشت] هستند."],["عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ","بر تخت‌ها [تکیه زده و] می‌نگرند."],["تَعْرِفُ فِى وُجُوهِهِمْ نَضْرَةَ ٱلنَّعِيمِ","خرمی و نشاطِ نعمت [بهشت] را در چهره‌هایشان [می بینی و] می‌شناسی."],["يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ","آنها از شراب نابِ مُهرشده، [نوشانیده و] سیراب می‌شوند."],["خِتَٰمُهُۥ مِسْكٌ وَفِى ذَٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَٰفِسُونَ","مُهری که بر آن نهاده شده، از مُشک است، و مشتاقان [رحمت]، در این [شراب و دیگر نعمت‌های بهشتی] باید بر یکدیگر پیشی گیرند."],["وَمِزَاجُهُۥ مِن تَسْنِيمٍ","و آمیزه‌اش از [چشمه] تسنیم است؛"],["عَيْنًا يَشْرَبُ بِهَا ٱلْمُقَرَّبُونَ","[همان] چشمه‌ای که مقربان [درگاه الهی] از آن می‌نوشند."],["إِنَّ ٱلَّذِينَ أَجْرَمُوا۟ كَانُوا۟ مِنَ ٱلَّذِينَ ءَامَنُوا۟ يَضْحَكُونَ","همانا کسانی که جرم و گناه مرتکب شدند، پیوسته [در دنیا] بر کسانی‌ که ایمان آورده بودند می‌خندیدند."],["وَإِذَا مَرُّوا۟ بِهِمْ يَتَغَامَزُونَ","و هر گاه [مؤمنان] از کنار‌شان می‌گذشتند، با چشم و ابرو به هم اشاره می‌کردند [و آنان را به سُخره می‌گرفتند]؛"],["وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ","و چون به سوی خانوادۀ خود بازمی‌گشتند، [به خاطر تمسخرِ مؤمنان] شادمان و خندان بودند؛"],["وَإِذَا رَأَوْهُمْ قَالُوٓا۟ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ","و هنگامی که مؤمنان را می‌دیدند می‌گفتند: «بی‌گمان، اینان گمراهانند»؛"],["وَمَآ أُرْسِلُوا۟ عَلَيْهِمْ حَٰفِظِينَ","در حالی ‌که آنان برای مراقبت [و نگهبانی،] بر مؤمنان فرستاده نشده بودند."],["فَٱلْيَوْمَ ٱلَّذِينَ ءَامَنُوا۟ مِنَ ٱلْكُفَّارِ يَضْحَكُونَ","ولی امروز کسانی ‌که ایمان آورده‌اند، به کافران می‌خندند."],["عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ","بر تخت‌های [آراسته نشسته و به نعمت‌های الهی که برترین آنها، رؤیت وجه گرامی الله است] می‌نگرند."],["هَلْ ثُوِّبَ ٱلْكُفَّارُ مَا كَانُوا۟ يَفْعَلُونَ","آیا کافران [با چشیدن عذاب،] جزای آنچه را که می‌کردند دریافت نموده‌اند؟"]]},{"id":84,"ar":"الإنشقاق","fa":"انشقاق","v":[["إِذَا ٱلسَّمَآءُ ٱنشَقَّتْ","آنگاه ‌که آسمان شکافته شود،"],["وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","و به [فرمان] پروردگارش گوش فرا دهد [و تسلیم شود]؛ و سزاوار است [که چنین کند]،"],["وَإِذَا ٱلْأَرْضُ مُدَّتْ","و آنگاه ‌که زمین گسترده [و هموار] شود،"],["وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","و هر چه را درون خود دارد، بیرون ریزد و تهی گردد،"],["وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","و به [فرمان] پروردگارش گوش دهد [و تسلیم شود]؛ و سزاوار است [که چنین کند]."],["يَٰٓأَيُّهَا ٱلْإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَٰقِيهِ","ای انسان، بی‌گمان، تو در راه [رسیدن به] پروردگارت سخت تلاش و کوشش می‌کنی؛ پس او را ملاقات خواهی کرد."],["فَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ بِيَمِينِهِۦ","و اما کسی ‌که نامۀ [اعمال] او به دست راستش داده شود،"],["فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا","به زودی به حسابی آسان، محاسبه می‌شود."],["وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًا","و شادمان به سوی خانواده‌اش بازمی‌گردد؛"],["وَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ وَرَآءَ ظَهْرِهِۦ","و اما کسی ‌که نامۀ [اعمال] او از پشت سرش به او داده شود."],["فَسَوْفَ يَدْعُوا۟ ثُبُورًا","به زودی نابودیِ خود را خواهد ‌طلبید"],["وَيَصْلَىٰ سَعِيرًا","و به [آتش] جهنم شعله‌ور در خواهد آمد."],["إِنَّهُۥ كَانَ فِىٓ أَهْلِهِۦ مَسْرُورًا","بی‌گمان، او در [دنیا به خاطر گناهانش،] در میان خانوادۀ خود شادمان بود."],["إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ","او گمان می‌کرد که هرگز [به نزد الله] بازنخواهد گشت."],["بَلَىٰٓ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرًا","آری؛ همانا پروردگارش از حال وی آگاه بود."],["فَلَآ أُقْسِمُ بِٱلشَّفَقِ","به شفق سوگند می‌خورم،"],["وَٱلَّيْلِ وَمَا وَسَقَ","و سوگند به شب و آنچه را فرو می‌پوشد"],["وَٱلْقَمَرِ إِذَا ٱتَّسَقَ","و سوگند به ماه چون [فروغش] کامل شود"],["لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ","که قطعاً مراتب و حالات مختلفی را یکی پس از دیگری [در مسیر زندگی دنیوی] طی خواهید کرد."],["فَمَا لَهُمْ لَا يُؤْمِنُونَ","آنان را چه شده که ایمان نمی‌آورند؟"],["وَإِذَا قُرِئَ عَلَيْهِمُ ٱلْقُرْءَانُ لَا يَسْجُدُونَ","و [چرا] هنگامی‌ که قرآن بر آنان تلاوت می‌شود سجده نمی‌کنند؟"],["بَلِ ٱلَّذِينَ كَفَرُوا۟ يُكَذِّبُونَ","بلکه کسانی‌ که کافر شدند، پیوسته [آیات الهی را] تکذیب می‌کنند."],["وَٱللَّهُ أَعْلَمُ بِمَا يُوعُونَ","و الله به آنچه در دل پنهان می‌دارند، دانا‌تر است."],["فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ","پس [ای پیامبر،] آنان را به عذابی دردناک بشارت ده؛"],["إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ","مگر کسانی که ایمان آورده‌اند و کارهای شایسته انجام داده‌اند، که پاداشی بی‌منّت و پیوسته برایشان است."]]},{"id":85,"ar":"البروج","fa":"بروج","v":[["وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ","سوگند به آسمان که دارندۀ بُرج‌هاست،"],["وَٱلْيَوْمِ ٱلْمَوْعُودِ","و سوگند به روز موعود [قیامت]،"],["وَشَاهِدٍ وَمَشْهُودٍ","و سوگند به هر کس که گواهی دهد و به هر کس که مورد گواهی قرار گیرد."],["قُتِلَ أَصْحَٰبُ ٱلْأُخْدُودِ","مرگ بر آدم‌سوزان خندق!"],["ٱلنَّارِ ذَاتِ ٱلْوَقُودِ","[همان آتشِ] افروخته از هیزم‌های بسیار [که مؤمنان را در آن می‌سوزاندند]؛"],["إِذْ هُمْ عَلَيْهَا قُعُودٌ","هنگامی ‌که بر [کنارۀ] آن نشسته بودند"],["وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌ","و آنچه را با مؤمنان انجام می‌دادند، تماشا می‌کردند؛"],["وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ","و هیچ ایرادی از آنان [= مؤمنان] نگرفتند، جز اینکه به الله پیروزمندِ ستوده ایمان آورده بودند."],["ٱلَّذِى لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ شَهِيدٌ","[همان] ذاتی که فرمانروایی آسمان‌ها و زمین از آنِ اوست؛ و الله بر همه چیز گواه است."],["إِنَّ ٱلَّذِينَ فَتَنُوا۟ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ثُمَّ لَمْ يَتُوبُوا۟ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ","به راستی کسانی که مردان و زنان مؤمن را شکنجه [و آزار] دادند و پس [از انجام آن کار،] توبه نکردند، عذاب جهنم برایشان [مهیّا] است و عذاب آتش [در پیش دارند]."],["إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ جَنَّٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ذَٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ","همانا برای کسانی ‌که ایمان آوردند و کار‌های شایسته کردند، باغ‌هایی [از بهشت] است که جویبارها زیر [درختان] آن جاری است؛ و این است کامیابی بزرگ."],["إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","بی‌گمان، [مجازات و] گرفتن پروردگارت بسیار شدید است."],["إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ","در حقیقت، اوست که [آفرینش را] آغاز می‌کند و دوباره [بعد از مرگ] بازمی‌گرداند؛"],["وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ","و همو آمرزنده [و] دوستدار [مؤمنان] است."],["ذُو ٱلْعَرْشِ ٱلْمَجِيدُ","[الله] صاحب‌عرش [و] بلندمرتبه [و شکوهمند] است"],["فَعَّالٌ لِّمَا يُرِيدُ","[و] آنچه را بخواهد، انجام می‌دهد."],["هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ","[ای پیامبر،] آیا داستان لشکر‌یان [حق‌ستیز] به تو رسیده است؟"],["فِرْعَوْنَ وَثَمُودَ","[لشکر] فرعون و [قوم] ثمود."],["بَلِ ٱلَّذِينَ كَفَرُوا۟ فِى تَكْذِيبٍ","بلکه کسانی ‌که کافر شدند، پیوسته در تکذیب [حق] هستند،"],["وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطٌۢ","و الله از هر سو بر آنان احاطه دارد."],["بَلْ هُوَ قُرْءَانٌ مَّجِيدٌ","آری، این [آیات، شعر و سحر نیست؛ بلکه] قرآن شکوهمند است."],["فِى لَوْحٍ مَّحْفُوظٍۭ","در لوح محفوظ [از هر گونه تحریف و تبدیل، در امان] است."]]},{"id":86,"ar":"الطارق","fa":"طارق","v":[["وَٱلسَّمَآءِ وَٱلطَّارِقِ","سوگند به آسمان و سوگند به ستارۀ شبگرد."],["وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ","و تو چه می‌دانی که ستارۀ شبگرد چیست؟"],["ٱلنَّجْمُ ٱلثَّاقِبُ","[همان] ستارۀ فروزان است."],["إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","هیچ کس نیست، مگر اینکه نگهبانی [از فرشتگان] بر او[گماشته شده] است."],["فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ","انسان باید بنگرد که از چه چیز آفریده شده است:"],["خُلِقَ مِن مَّآءٍ دَافِقٍ","از یک آب جهنده آفریده شده"],["يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ","که از میان [استخوانِ] پشت [مرد] و سینۀ [زن] بیرون می‌آید."],["إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌ","بی‌گمان، الله بر بازگرداندن او [پس از مرگ] تواناست."],["يَوْمَ تُبْلَى ٱلسَّرَآئِرُ","روزی ‌که [تمام] رازها فاش شود،"],["فَمَا لَهُۥ مِن قُوَّةٍ وَلَا نَاصِرٍ","[در آن روز،] انسان هیچ توان و یاوری ندارد."],["وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ","سوگند به آسمان پرباران"],["وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ","و سوگند به زمینِ پرشکاف [که گیاهان از آن سر برمی‌آورند]."],["إِنَّهُۥ لَقَوْلٌ فَصْلٌ","[که] بی‌گمان، این قرآن، سخن جداکنندۀ حق از باطل است"],["وَمَا هُوَ بِٱلْهَزْلِ","و [سخنِ] هزل و بیهوده نیست."],["إِنَّهُمْ يَكِيدُونَ كَيْدًا","آنان [= کافران] پیوسته حیله و نیرنگ می‌کنند"],["وَأَكِيدُ كَيْدًا","و من [نیز] حیله [و تدبیر] می‌کنم؛"],["فَمَهِّلِ ٱلْكَٰفِرِينَ أَمْهِلْهُمْ رُوَيْدًۢا","پس به کافران مهلت بده [و] اندکی رهایشان کن [تا غرق گناه باشند]."]]},{"id":87,"ar":"الأعلى","fa":"اعلی","v":[["سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى","نام پروردگار بلند مرتبه‌ات را به پاکی یاد کن."],["ٱلَّذِى خَلَقَ فَسَوَّىٰ","[همان ذاتی] که [انسان را] آفرید و هماهنگ و متعادل ساخت."],["وَٱلَّذِى قَدَّرَ فَهَدَىٰ","و [همان] ذاتی‌ که اندازه‌گیری کرد و [به شایستگی آفرید] و سپس هدایت نمود."],["وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ","و [آن] ذاتی‌ که چراگاه را [برای تغذیۀ جانداران] رویانید."],["فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ","سپس آن را خشک و سیاه گردانید."],["سَنُقْرِئُكَ فَلَا تَنسَىٰٓ","ما به زودی [قرآن را] بر تو می‌خوانیم؛ پس تو هرگز [آن را] فراموش نخواهی کرد؛"],["إِلَّا مَا شَآءَ ٱللَّهُ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ","مگر آنچه را که الله بخواهد؛ همانا او آشکار و نهان را می‌داند."],["وَنُيَسِّرُكَ لِلْيُسْرَىٰ","و آسان‌ترین [راه‌] را برایت فراهم مى‌گردانیم."],["فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ","اگر پند مفید باشد، [مردم را با آیات قرآن] پند ده."],["سَيَذَّكَّرُ مَن يَخْشَىٰ","به زودی کسی‌ که [از الله] می‌ترسد، پند می‌پذیرد."],["وَيَتَجَنَّبُهَا ٱلْأَشْقَى","و بدبخت‌ترین [مردم،] از آن دوری می‌گزیند؛"],["ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ","[همان] کسی‌ که در آتش بزرگ [جهنم] درخواهد آمد،"],["ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","و در آن [آتش] نه می‌میرد و نه زنده می‌مانَد."],["قَدْ أَفْلَحَ مَن تَزَكَّىٰ","یقیناً کسی ‌که خود را [از کفرو گناه] پاک کند، رستگار خواهد شد؛"],["وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ","و [نیز کسی که] نام پروردگارش را یاد کند و نماز بگزارد."],["بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","ولی شما [مردم،] زندگی دنیا را [بر آخرت] ترجیح می‌دهید؛"],["وَٱلْـَٔاخِرَةُ خَيْرٌ وَأَبْقَىٰٓ","در حالی‌ که آخرت، بهتر و پاینده‌تر است."],["إِنَّ هَٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ","به راستی این [پندها] در کتاب‌های آسمانی پیشین [نیز] بود؛"],["صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ","کتاب‌های ابراهیم و موسی."]]},{"id":88,"ar":"الغاشية","fa":"غاشیه","v":[["هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ","[ای پیامبر،] آیا خبرِ قیامت هولناکِ فراگیر به تو رسیده است؟"],["وُجُوهٌ يَوْمَئِذٍ خَٰشِعَةٌ","در آن روز، چهره‌هایی خوار و ذلیل خواهند بود."],["عَامِلَةٌ نَّاصِبَةٌ","[در دنیا] پیوسته تلاش کرده [و] خسته شده [و چون در راه حق نبوده، نتیجه‌ای ندیده‌اند]."],["تَصْلَىٰ نَارًا حَامِيَةً","در آتش سوزان درمی‌آیند،"],["تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍ","از چشمۀ بسیار داغ به آنها نوشانیده می‌شود."],["لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","غذایی جز خارِ خشک و تلخ ندارند"],["لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍ","که نه [آنان را] فربه کند و نه گرسنگی را دفع نماید."],["وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","در آن روز، چهره‌هایی شاداب و تازه هستند"],["لِّسَعْيِهَا رَاضِيَةٌ","و از سعی [و تلاش] خود راضیند؛"],["فِى جَنَّةٍ عَالِيَةٍ","در بهشت برین هستند."],["لَّا تَسْمَعُ فِيهَا لَٰغِيَةً","در آنجا هیچ سخن بیهوده‌ای نمی‌شنوند."],["فِيهَا عَيْنٌ جَارِيَةٌ","در آن، چشمه[های آب] روان است."],["فِيهَا سُرُرٌ مَّرْفُوعَةٌ","تخت‌های [زیبای] بلند [پایه] در آن است."],["وَأَكْوَابٌ مَّوْضُوعَةٌ","و جام‌هایی [که در کنار چشمه‌ها] نهاده شده."],["وَنَمَارِقُ مَصْفُوفَةٌ","و بالشت‌های [منظم] چیده‌شده،"],["وَزَرَابِىُّ مَبْثُوثَةٌ","و [نیز] فرش‌های گرانبها گسترده شده است."],["أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ","آیا [کافران] به شتر نمی‌نگرند که چگونه آفریده شده است؟"],["وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ","و به آسمان [نمی‌نگرند] که چگونه برافراشته شده است؟"],["وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ","و به کوه‌ها [نمی‌نگرند] که چگونه [محکم بر زمین] نصب شده است؟"],["وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ","و به زمین [نمی‌نگرند] که چگونه گسترده شده است؟"],["فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌ","[ای پیامبر،] پند بده، که تو فقط پنددهنده‌ای."],["لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","تو بر آنان مسلط [و چیره] نیستی [که آنان را بر ایمان‌آوردن وادار کنی]."],["إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","اما کسی‌ که روی بگردانَد و کافر شود"],["فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ","الله او را با بزرگ‌ترین عذاب، مجازات می‌کند."],["إِنَّ إِلَيْنَآ إِيَابَهُمْ","همانا بازگشت آنها به سوی ماست."],["ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم","سپس بی‌گمان، حسابشان [نیز] با ماست."]]},{"id":89,"ar":"الفجر","fa":"فجر","v":[["وَٱلْفَجْرِ","سوگند به سپيده‌دم [صبحگاهان]"],["وَلَيَالٍ عَشْرٍ","و به شب‌های دهگانه [آغاز ذی‌حجه]"],["وَٱلشَّفْعِ وَٱلْوَتْرِ","و به زوج و فرد [اشیاء]"],["وَٱلَّيْلِ إِذَا يَسْرِ","و سوگند به شب، هنگامی‌ که [حرکت می‌کند و] می‌رود."],["هَلْ فِى ذَٰلِكَ قَسَمٌ لِّذِى حِجْرٍ","آیا در این [چیزها] سوگندی برای صاحب‌خرد نیست [که او را قانع نماید]؟"],["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","[ای پیامبر،] آیا ندیدی که پروردگارت با [قوم] عاد چه کرد؟"],["إِرَمَ ذَاتِ ٱلْعِمَادِ","[همان قبیلۀ] اِرَم که دارای [کاخ‌هایی با] ستونهای بلند بودند"],["ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ","که همانند آن در شهرها آفریده نشده بود؟"],["وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ","و [نیز قوم] ثَمود، کسانی که صخره‌های سخت را از [کنار] وادی می‌تراشیدند [و خانه برای خودشان می‌ساختند]؟"],["وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ","و فرعون، صاحب سپاه [بزرگ و قدرتمند]."],["ٱلَّذِينَ طَغَوْا۟ فِى ٱلْبِلَٰدِ","[همان] کسانی که در شهر‌ها طغیان [و سرکشی] کردند"],["فَأَكْثَرُوا۟ فِيهَا ٱلْفَسَادَ","و فسادِ بسیار در آنها به بار آوردند."],["فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","آنگاه پروردگارت تازیانۀ عذاب را بر آنان فرود آورد."],["إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ","یقیناً پروردگار تو در کمینگاه است."],["فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ","و اما انسان هنگامی که پروردگارش او را بیازماید و گرامی دارد و به او نعمت بخشد، [مغرور می‌گردد و گمان می‌کند که این امر به خاطر کرامتی است که نزد الله دارد]، پس می‌گوید: «پروردگارم مرا گرامی داشته است»؛"],["وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَٰنَنِ","و اما هنگامی که او را بیازماید و روزی‌اش را بر او تنگ سازد، [دلسرد ‌شده و گمان می‌کند که این امر بدان سبب است که نزد الله، خوار و ذلیل است؛] پس می‌گوید: «پروردگارم مرا خوار کرده است»."],["كَلَّا بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ","هرگز چنین نیست [که شما می‌پندارید]؛ بلکه شما یتیم را گرامی نمی‌دارید"],["وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","و یکدیگر را بر اطعام مستمندان ترغیب نمی‌کنید"],["وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًا لَّمًّا","و میراث را حریصانه می‌خورید [و حق ضعیفان را نمی‌دهید]"],["وَتُحِبُّونَ ٱلْمَالَ حُبًّا جَمًّا","و مال و ثروت [دنیا] را بسیار دوست دارید."],["كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّا دَكًّا","هرگز چنین نیست [که شما گمان می‌کنید]؛ هنگامی ‌که زمین سخت در هم کوبیده شود [و هموار گردد]"],["وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّا صَفًّا","و پروردگارت [برای دادرسی] بیاید و [نیز] فرشتگان صف‌درصف [بایستند]"],["وَجِا۟ىٓءَ يَوْمَئِذٍۭ بِجَهَنَّمَ يَوْمَئِذٍ يَتَذَكَّرُ ٱلْإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ","و در آن روز جهنم آورده شود، آن روز است که انسان [کافر] پند می‌گیرد [و توبه می‌کند]؛ و [اما] این پند گرفتن، چه سودی برایش دارد؟"],["يَقُولُ يَٰلَيْتَنِى قَدَّمْتُ لِحَيَاتِى","وی می‌گوید: «ای کاش [در دنیا] برای [این] زندگی‌ام [اعمال نیک، از] پیش فرستاده بودم!»"],["فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌ","در آن روز، هیچ کس همانند عذاب او [= الله] عذاب نمی‌کند،"],["وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌ","و هیچ کس همچون بند کشیدن او [= الله]، کسی را به بند نمی‌کشد."],["يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","[اما به مؤمن ندا می‌شود:] «ای روحِ آرام‌یافته،"],["ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","به سوی پروردگارت بازگرد، در حالی که تو [از پاداشِ الله] راضی هستی، و او از [اعمال] تو راضی است."],["فَٱدْخُلِى فِى عِبَٰدِى","پس در زمرۀ بندگان [خاصّ] من در آی"],["وَٱدْخُلِى جَنَّتِى","و به بهشت من وارد شو»."]]},{"id":90,"ar":"البلد","fa":"بلد","v":[["لَآ أُقْسِمُ بِهَٰذَا ٱلْبَلَدِ","سوگند به این شهر [مکه]."],["وَأَنتَ حِلٌّۢ بِهَٰذَا ٱلْبَلَدِ","در حالی که [ای پیامبر!] تو در این شهر ساکنی [و جنگ در این شهر برایت حلال است]"],["وَوَالِدٍ وَمَا وَلَدَ","و سوگند به پدر [= آدم] و فرزندانش."],["لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِى كَبَدٍ","یقیناً ما انسان را در رنج [و دشواری‌های دنیوی] آفریدیم."],["أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","آیا او گمان می‌کند هیچ کس بر [مجازاتِ] وی توانا نیست؟"],["يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","می‌گوید: «[به خاطرِ انفاق،] مال زیادی را تباه کرده‌ام»."],["أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ","آیا می‌پندارد که هیچ کس او را ندیده است؟"],["أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","آیا دو چشم برایش قرار ندادیم؟"],["وَلِسَانًا وَشَفَتَيْنِ","و یک زبان و دو لب؟"],["وَهَدَيْنَٰهُ ٱلنَّجْدَيْنِ","و او را به دو راه [خیر و شر] راهنمایی کردیم."],["فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ","اما به گردنۀ [سخت] قدم نگذاشت [و نیامد]."],["وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ","و تو چه می‌دانی که آن گردنۀ [سخت] چیست؟"],["فَكُّ رَقَبَةٍ","آزاد کردن برده‌ای است."],["أَوْ إِطْعَٰمٌ فِى يَوْمٍ ذِى مَسْغَبَةٍ","یا اطعام در روز قحطی [و گرسنگی]،"],["يَتِيمًا ذَا مَقْرَبَةٍ","[خواه] یتیمی از خویشاوندان [باشد]"],["أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","یا مستمندی خاک نشین؛"],["ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ","به علاوه، از کسانی باشد که ایمان آورده‌اند و یکدیگر را به صبر [بر عبادت و دوری از گناه] و مهربانی [با بندگان] توصیه نموده‌اند."],["أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْمَيْمَنَةِ","اینان اهل سعادتند [که نامۀ اعمال آنان به دست راستشان داده می‌شود و اهل بهشتند]."],["وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا هُمْ أَصْحَٰبُ ٱلْمَشْـَٔمَةِ","اما کسانی ‌که به آیات ما کفر ورزیدند، آنان اهل شقاوتند [که نامۀ اعمال به دست چپشان داده می‌شود و به دوزخ می‌روند]."],["عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌۢ","[از هر سو] آتش سرپوشید‌ه‌ای بر آنان است [که راه فرار ندارند]."]]},{"id":91,"ar":"الشمس","fa":"شمس","v":[["وَٱلشَّمْسِ وَضُحَىٰهَا","سوگند به خورشید و روشنیِ آن [به هنگام بامداد]،"],["وَٱلْقَمَرِ إِذَا تَلَىٰهَا","و سوگند به ماه، هنگامی که بعد از آن [= خورشید] در‌آید،"],["وَٱلنَّهَارِ إِذَا جَلَّىٰهَا","و سوگند به روز، هنگامی‌ که آن [= خورشید] را روشن [و جلوه‌گر] کند،"],["وَٱلَّيْلِ إِذَا يَغْشَىٰهَا","و سوگند به شب، هنگامی که آن را بپوشانَد،"],["وَٱلسَّمَآءِ وَمَا بَنَىٰهَا","و سوگند به آسمان و به ذاتی که آن را بنا کرد،"],["وَٱلْأَرْضِ وَمَا طَحَىٰهَا","و سوگند به زمین و به ذاتی که آن را گسترانید،"],["وَنَفْسٍ وَمَا سَوَّىٰهَا","و سوگند به جانِ [انسان] و ذاتی که آن را [آفرید و] نیکو گردانید،"],["فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا","سپس نافرمانی و پرهیزگاری‌اش را [به او] الهام کرد."],["قَدْ أَفْلَحَ مَن زَكَّىٰهَا","بی‌تردید، هر کس نفس خود را [از گناهان] پاک کند، رستگار می‌شود."],["وَقَدْ خَابَ مَن دَسَّىٰهَا","و هر کس آن را [با گناه] آلوده سازد، یقیناً زیانکار می‌شود."],["كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ","[قوم] ثمود از روی سرکشی، [پیامبر‌شان را] تکذیب کردند،"],["إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا","آنگاه که بدکار‌ترین آنان [برای اقدام به جنایت] برخاست."],["فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا","پیامبر الله [= صالح] به آنان گفت: «ماده‌شترِ الله و [نوبت‌] آب‌خوردنش را [حرمت نهید]»."],["فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا","[ولی آنان] او را تکذیب کردند و آن [ماده‌شتر] را کشتند؛ پس پروردگار آنان به سبب گناهانشان بر سر‌شان عذاب آورد و همگی آنان را با خاک یکسان کرد"],["وَلَا يَخَافُ عُقْبَٰهَا","و [الله] از سرانجام آن [کار،] بیم ندارد."]]},{"id":92,"ar":"الليل","fa":"لیل","v":[["وَٱلَّيْلِ إِذَا يَغْشَىٰ","سوگند به شب، هنگامی ‌که [همه چیز را] بپوشانَد،"],["وَٱلنَّهَارِ إِذَا تَجَلَّىٰ","و سوگند به روز، هنگامی‌ که آشکار شود،"],["وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ","و سوگند به ذاتی که نر و ماده را آفرید،"],["إِنَّ سَعْيَكُمْ لَشَتَّىٰ","که یقیناً سعی [و تلاش] شما مختلف [و نیک و بد] است."],["فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ","و اما کسی‌ که [در راه الله] ببخشد و پرهیزگاری نماید"],["وَصَدَّقَ بِٱلْحُسْنَىٰ","و [وعدۀ الله و سخنان] نیک را تصدیق کند،"],["فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ","پس به‌زودی او را برای [راهِ] آسان [= اعمال نیکو و انفاق در راهِ الله] توفیق می‌دهیم."],["وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ","و اما کسی‌که بخل ورزد و بی‌نیازی بجوید،"],["وَكَذَّبَ بِٱلْحُسْنَىٰ","و [وعدۀ الله و سخنانِ] نیک را تکذیب کند،"],["فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ","به زودی انجام دشواری [= اعمال شر و پلید] را برایش آسان می‌سازیم [و انجام کار خیر را بر او سخت می‌گردانیم]؛"],["وَمَا يُغْنِى عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ","و در هنگام [مرگ و] ورود به دوزخ، دارایی او سودی به حالش نخواهد داشت."],["إِنَّ عَلَيْنَا لَلْهُدَىٰ","مسلماً هدایت [بندگان] بر [عهدۀ] ماست."],["وَإِنَّ لَنَا لَلْـَٔاخِرَةَ وَٱلْأُولَىٰ","و محققاً آخرت و دنیا [نیز] از آنِ ماست."],["فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","من شما را از آتشی شعله‌ور بیم دادم"],["لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى","که جز بدبخت‌ترین [مردم] در آن نیفتد؛"],["ٱلَّذِى كَذَّبَ وَتَوَلَّىٰ","[همان] کسی ‌که [آیات ما را] تکذیب کرد و روی گرداند"],["وَسَيُجَنَّبُهَا ٱلْأَتْقَى","و به زودی پرهیزگارترین [مردم] از آن دور نگه داشته می‌شود."],["ٱلَّذِى يُؤْتِى مَالَهُۥ يَتَزَكَّىٰ","[همان] کسی‌که مال خود را [در راه الله] می‌بخشد تا [از گناه] پاک شود."],["وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍ تُجْزَىٰٓ","و هیچ كس را به قصد پاداش‌یافتن نعمت نمى‌بخشد؛"],["إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ","مگر [برای] کسبِ رضا [و خشنودی] پروردگار برترش."],["وَلَسَوْفَ يَرْضَىٰ","و به راستی که [با پاداشِ الله] راضی خواهد شد."]]},{"id":93,"ar":"الضحى","fa":"ضحی","v":[["وَٱلضُّحَىٰ","سوگند به آغاز روز،"],["وَٱلَّيْلِ إِذَا سَجَىٰ","و سوگند به شب، هنگامی‌ که آرام گیرد"],["مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","[که] پروردگارت تو را وانگذاشته و [بر تو] خشم نگرفته است."],["وَلَلْـَٔاخِرَةُ خَيْرٌ لَّكَ مِنَ ٱلْأُولَىٰ","و مسلماً آخرت برای تو از دنیا بهتر است."],["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","و به زودی پروردگارت به تو [و امت تو آنقدر] عطا خواهد کرد که راضی گردی."],["أَلَمْ يَجِدْكَ يَتِيمًا فَـَٔاوَىٰ","آیا تو را یتیم نیافت، و پناه داد؟"],["وَوَجَدَكَ ضَآلًّا فَهَدَىٰ","و تو را [راه‌نایافته و] سرگشته یافت، و هدایت کرد."],["وَوَجَدَكَ عَآئِلًا فَأَغْنَىٰ","و تو را فقیر یافت، و بی‌نیاز نمود."],["فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ","پس [تو نیز] یتیم را میازار،"],["وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ","و [مستمندِ] نیازخواه را مران [و با او خشونت مکن]،"],["وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","و نعمت‌های پروردگارت را بازگو کن [و سپاس گزار]."]]},{"id":94,"ar":"الشرح","fa":"شرح","v":[["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","[ای پیامبر،] آیا ما سینه‌ات را [برای نزول وحی] برایت نگشودیم؟"],["وَوَضَعْنَا عَنكَ وِزْرَكَ","و سنگینی [بارِ گناه و دشواریِ رسالت] را از [دوشِ] تو برنداشتیم؟"],["ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ","همان [باری] که بر پشتت سنگینی می‌کرد."],["وَرَفَعْنَا لَكَ ذِكْرَكَ","و [نام و] آوازۀ تو را بلند ساختیم."],["فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","مسلماً با [هر] دشواری، آسانی است."],["إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","[آری؛] مسلماً با [هر] دشواری، آسانی است."],["فَإِذَا فَرَغْتَ فَٱنصَبْ","پس هنگامی‌ که [از کار و امور دنیا] فارغ شدی، [به عبادت پروردگارت] بکوش"],["وَإِلَىٰ رَبِّكَ فَٱرْغَب","و به سوی پروردگارت راغب [و مشتاق] شو."]]},{"id":95,"ar":"التين","fa":"تین","v":[["وَٱلتِّينِ وَٱلزَّيْتُونِ","سوگند به انجیر و زیتون"],["وَطُورِ سِينِينَ","و سوگند به طورِ سینا"],["وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ","و سوگند به این شهر امن [مکه]"],["لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍ","[که] یقیناً ما انسان را در بهترین صورت [و با فطرت پاک] آفریدیم."],["ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ","سپس او را [که انحراف یافت،] به پست‌ترین [مراحلِ] پَستی برگرداندیم."],["إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","مگر کسانی که ایمان آوردند و کار‌های شایسته انجام دادند؛ که پاداشی پایدار برایشان [در پیش] است."],["فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ","پس [ای انسان،] چه چیزی بعد [از این همه دلایل روشن،] تو را به تکذیب [روز] جزا وا می‌دارد؟"],["أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ","آیا الله بهترین داور [و حاکم مطلق] نیست؟"]]},{"id":96,"ar":"العلق","fa":"علق","v":[["ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","بخوان به نام پروردگارت که [هستی را] آفرید؛"],["خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ","[همان پروردگاری که] انسان را از خونِ بسته آفرید."],["ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","بخوان و پروردگارت [از همه] بزرگوار‌تر است."],["ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","[همان] ذاتی ‌که به وسیلۀ قلم [نوشتن] آموخت."],["عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ","به انسان آنچه را که نمی‌دانست [به تدریج] آموخت."],["كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ","چنین نیست [که شما می‌پندارید]؛ حقا که انسان طغیان [و سرکشی] می‌کند"],["أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","[بعد] از اینکه خود را بی‌نیاز [و توانگر] ببیند."],["إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ","یقیناً بازگشت [همه] به سوی پروردگار توست."],["أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ","[ای پیامبر،] آیا دیده‌ای آن کسی [= ابوجهل] را که [از عبادت الله] باز می‌دارد"],["عَبْدًا إِذَا صَلَّىٰٓ","بنده‌ای [= محمد] را هنگامی که [کنار کعبه] نماز می‌خواند."],["أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ","به من خبر بده اگر این [بنده بازداشته‌شده] بر [راه] هدایت باشد"],["أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ","یا [مردم را] به پرهیزگاری فرمان دهد، [سزای کسی‌ که چنین بنده‌ای را بیازارد چیست؟]"],["أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","به من خبر بده اگر این [شخص سرکش، حق را] تکذیب کند و رویگردان شود [آیا سزاوار عذاب نیست؟]."],["أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ","آیا نمی‌داند که بی‌تردید، الله [همه اعمالش را] می‌بیند؟"],["كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ","چنین نیست [که او گمان می‌کند]؛ اگر باز نیاید [و دست از شرارت برندارد،] قطعاً موی پیشانی [او] را به شدّت خواهیم گرفت [و به سوی دوزخ خواهیم کشاند]؛"],["نَاصِيَةٍ كَٰذِبَةٍ خَاطِئَةٍ","موی پیشانیِ [همان] دروغگوی خطاکار را."],["فَلْيَدْعُ نَادِيَهُۥ","پس باید هم‌مجلسانش را [به کمک] بخواند."],["سَنَدْعُ ٱلزَّبَانِيَةَ","ما [نیز] آتشبانان [دوزخ] را فرا خواهیم ‌خواند."],["كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب","چنین نیست [که او می‌پندارد]؛ هرگز او را اطاعت مکن و سجده کن، و [به الله] تقرّب جوی."]]},{"id":97,"ar":"القدر","fa":"قدر","v":[["إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ","همانا ما آن [قرآن] را در شب قدر نازل کردیم."],["وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","و تو چه دانی شب قدر چیست؟"],["لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","شب قدر، بهتر از هزار ماه است."],["تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","فرشتگان و روح [= جبرئیل] در آن [شب،] به فرمان پروردگارشان برای [انجام] هر کاری نازل می‌شوند."],["سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ","[آن شب] تا طلوع فجر، سلامت [و رحمت] است."]]},{"id":98,"ar":"البينة","fa":"بینه","v":[["لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ","کسانی از اهل کتاب و مشرکان ‌که کافر شدند، [از آیین کفر] دست برنمی‌دارند تا اینکه دلیل روشنی برایشان بیاید."],["رَسُولٌ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًا مُّطَهَّرَةً","پیامبری از سوی الله [بیاید] که صحیفه‌های پاک را بخواند."],["فِيهَا كُتُبٌ قَيِّمَةٌ","و نوشته‌هایی استوار [و درست] در آن [صحیفه‌ها] است."],["وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ","و کسانی‌ که به آنان کتاب داده شد [از جمله یهود و نصاری] پراکنده نشدند [و اختلاف نکردند،] مگر بعد از آنکه دلیل روشن برایشان آمد."],["وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ","و آنان فرمان نیافتند جز اینکه الله را عبادت کنند در حالی ‌که دین [خود] را برای او خالص گردانند [و از شرک و عبادت معبودان باطل،] به توحید روی آورند؛ و نماز برپا دارند و زکات بپردازند؛ و این است آیین راستین و مستقیم."],["إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ","بی‌گمان، کسانی از اهل کتاب و مشرکان ‌که کافر شدند، جاودانه در آتش جهنم خواهند ماند. آنان بدترینِ آفریدگان هستند."],["إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ","همانا کسانی که ایمان آوردند و کارهای شایسته انجام دادند، آنان بهترینِ آفریدگان هستند."],["جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًا رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ","پاداش آنان نزد پروردگار‌شان، باغ‌های [بهشت] جاویدان است که جویبارها از زیر [درختان] آن جاری است؛ همیشه در آن خواهند ماند؛ الله از [اعمال] آنها راضی است و آنان [نیز] از [پاداشِ] او راضیند؛ و این [مقام و پاداش،] برای کسی است که از پروردگارش بترسد."]]},{"id":99,"ar":"الزلزلة","fa":"زلزال","v":[["إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا","هنگامی که زمین با شدید‌ترین تکان‌هایش به لرزه درآید."],["وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا","و زمین بار‌های سنگینش را بیرون ریزد."],["وَقَالَ ٱلْإِنسَٰنُ مَا لَهَا","و انسان می‌گوید: «آن [= زمین] را چه شده است؟»"],["يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","در آن روز، [زمین] تمام خبرهایش را بازگو می‌کند؛"],["بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","زیرا که پروردگارت به او [چنین] وحی [و حکم] کرده است."],["يَوْمَئِذٍ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًا لِّيُرَوْا۟ أَعْمَٰلَهُمْ","در آن روز، مردم گروه‌گروه باز می‌گردند تا [نتیجۀ] اعمالشان به آنان نشان داده شود."],["فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ","آنگاه هر کس به‌ اندازۀ ذره‌ای کار نیک انجام داده باشد، [پاداشِ] آن را می‌بیند؛"],["وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ","و هر کس به اندازه ذره‌ای کار بد کرده باشد، [کیفرِ] آن را می‌بیند."]]},{"id":100,"ar":"العاديات","fa":"عادیات","v":[["وَٱلْعَٰدِيَٰتِ ضَبْحًا","سوگند به اسب‌های دونده که نفس‌زنان [به سوی میدان جهاد] پیش می‌روند."],["فَٱلْمُورِيَٰتِ قَدْحًا","و سوگند به اسب‌هایی که [با برخورد سُم‌هایشان به سنگ‌ها] جرقۀ [آتش] ایجاد می‌کنند."],["فَٱلْمُغِيرَٰتِ صُبْحًا","باز سوگند به اسب‌هایی که در صبحگاهان [بر دشمن] یورش می‌برند."],["فَأَثَرْنَ بِهِۦ نَقْعًا","و در آن هنگام گرد و غبار برمی‌انگیزند."],["فَوَسَطْنَ بِهِۦ جَمْعًا","آنگاه در دل [سپاه دشمن] می‌تازند."],["إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌ","یقیناً انسان در برابر [نعمت‌های] پروردگارش بسیار ناسپاس است،"],["وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","و بی‌گمان، او [خود] بر این [ناسپاسی] گواه است،"],["وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ","و همانا او علاقۀ فراوانی به مال [دنیا] دارد."],["أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ","آیا او نمی‌داند که در آن روز، آنچه در گور‌هاست، [همه زنده و] برانگیخته می‌شوند؟"],["وَحُصِّلَ مَا فِى ٱلصُّدُورِ","و آنچه در سینه‌هاست [همه] آشکار می‌گردد."],["إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌۢ","یقیناً در آن روز، پروردگارشان کاملاً به [وضع و حال] آنان آگاه است."]]},{"id":101,"ar":"القارعة","fa":"قارعه","v":[["ٱلْقَارِعَةُ","[آن] فروکوبنده."],["مَا ٱلْقَارِعَةُ","[آن] فروکوبنده چیست؟"],["وَمَآ أَدْرَىٰكَ مَا ٱلْقَارِعَةُ","و تو چه ‌دانی که [آن] فروکوبنده چیست؟"],["يَوْمَ يَكُونُ ٱلنَّاسُ كَٱلْفَرَاشِ ٱلْمَبْثُوثِ","روزی‌ که مردم مانند پروانه‌های پراکنده [حیران و سرگردان] خواهند بود."],["وَتَكُونُ ٱلْجِبَالُ كَٱلْعِهْنِ ٱلْمَنفُوشِ","و کوه‌ها مانند پشم رنگینِ حلاجی‌شده خواهند شد."],["فَأَمَّا مَن ثَقُلَتْ مَوَٰزِينُهُۥ","و اما هر کس که [در آن روز،] کفّۀ میزانش سنگین باشد،"],["فَهُوَ فِى عِيشَةٍ رَّاضِيَةٍ","[در بهشت،] در زندگی رضایت‌بخشی خواهد بود."],["وَأَمَّا مَنْ خَفَّتْ مَوَٰزِينُهُۥ","و اما هر کس که کفّۀ میزانش سبک باشد،"],["فَأُمُّهُۥ هَاوِيَةٌ","[مسکن و] پناهگاهش «هاویه» است."],["وَمَآ أَدْرَىٰكَ مَا هِيَهْ","و تو چه دانی که آن [هاویه] چیست؟"],["نَارٌ حَامِيَةٌۢ","آتشی است سوزان [و شعله‌ور]."]]},{"id":102,"ar":"التكاثر","fa":"تکاثر","v":[["أَلْهَىٰكُمُ ٱلتَّكَاثُرُ","زیاده‌خواهی، شما را به خود مشغول const MARKS = /[ً-ٰٟۖ-ۭـ]/;

const NOJOIN = new Set('اأإآٱدذرزوؤةىء');
function firstBits(word) {                       // حرف اول (برای «ال» تا حرف بعد از آن) + کشیده‌ی اتصال، تا بچه بفهمد بقیهٔ کلمه حذف شده

  if ((baseOf(cl[0]) === 'ٱ' || baseOf(cl[0]) === 'ا') && cl[1] && baseOf(cl[1]) === 'ل' && cl.length > 3) n = 3;
  if (n >= cl.length) return word;
  const head = cl.slice(0, n).join(''), last = baseOf(cl[n - 1]).slice(-1);

const puzzleUnits = w => cutUnits(w, Math.min(6, Math.max(3, Math.ceil(w.length / 2))));
WG.puzzle = {
  init: it => { const u = puzzleUnits(words(it.s, it.a)); return { u, slots: u.map(() => null), bank: shufNot(u.map((_, i) => i)), sel: null }; },
  html: (it, st) => {
    const solved = st.slots.every(x => x != null), rem = st.bank.filter(i => !st.slots.includes(i));
    return `<p class="prompt">${solved ? 'آفرین! پازل کامل شد. حالا آیه را بلند بخوان' : 'پازل را کامل کن: تکه‌ها را بکش یا بزن و جای درستشان بگذار'}</p>
      <div class="pz-board">${st.u.map((t, i) => st.slots[i] != null ? `<div class="pz-slot full" data-slot="${i}">${esc(st.u[st.slots[i]])}</div>`
        : `<button class="pz-slot" data-act="pzSlot" data-slot="${i}" aria-label="جای ${fa(i + 1)}"><b>${fa(i + 1)}</b></button>`).join('')}</div>
      ${solved ? contBtn : `<div class="pz-bank">${rem.map(i => `<button class="pz-piece${st.sel === i ? ' sel' : ''}" style="--h:${(i * 53 + 190) % 360}" data-act="pzPick" data-pc="${i}">${esc(st.u[i])}</button>`).join('')}</div>`}`;
  }
};
function pzPlace(pc, slot) {
  const c = sess && sess.cur; if (!c || c.steps[c.si] !== 'puzzle') return; const st = c.st;
  if (st.slots[slot] != null || st.slots.includes(pc)) return;
  if (st.u[pc] === st.u[slot]) { st.slots[slot] = pc; st.sel = null; chime(); draw(); }
  else { c.mist++; chime('bad'); const el = document.querySelector(`.pz-piece[data-pc="${pc}"]`), sl = document.querySelector(`.pz-slot[data-slot="${slot}"]`); [el, sl].forEach(x => { if (x) { x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 450); } }); }
}

/* ---- حباب کلمه ---- */
WG.bubbles = {
  init: it => {
    const w = words(it.s, it.a), u = w.length <= 8 ? w.slice() : cutUnits(w, 8), n = u.length, cols = n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
    const cells = shuffle([...Array(cols * rows).keys()]).slice(0, n);
    const pos = u.map((_, i) => { const k = cells[i], cx = k % cols, cy = Math.floor(k / cols); return { x: ((cx + .5 + (Math.random() - .5) * .3) / cols * 100).toFixed(1), y: ((cy + .5 + (Math.random() - .5) * .25) / rows * 100).toFixed(1), d: (3 + Math.random() * 2).toFixed(1), h: (180 + Math.random() * 140) | 0 }; });
    return { u, pos, next: 0, got: [] };
  },
  html: (it, st) => {
    const solved = st.next >= st.u.length;
    return `<p class="prompt">${solved ? 'آفرین! همهٔ حباب‌ها ترکید. آیه را بلند بخوان' : 'حباب‌ها را به ترتیب آیه بترکان'}</p>
      <div class="built ayah" aria-live="polite">${st.got.length ? st.got.map(i => esc(st.u[i])).join(' ') : '<span class="muted" style="font-size:1rem;font-family:var(--ui)">کلمهٔ اول را پیدا کن</span>'}</div>
      ${solved ? contBtn : `<div class="bubbles">${st.u.map((t, i) => st.got.includes(i) ? '' : `<button class="bubble" style="left:${st.pos[i].x}%;top:${st.pos[i].y}%;--h:${st.pos[i].h};--dur:${st.pos[i].d}s" data-act="bubTap" data-i="${i}">${esc(t)}</button>`).join('')}</div>`}`;
  }
};

/* ---- اشتباه‌یاب ---- */
WG.spot = {
  init: it => {
    const w = words(it.s, it.a), n = w.length; let w2 = w.slice(), bad = [], type = 'sub';
    for (const i of shuffle([...w.keys()])) {                         // جایگزینی: فقط کلمه‌ای که با همسایه‌هایش در هیچ آیه‌ای نیامده باشد
      const d = distractWords(w[i], it.s, { prev: w[i - 1], next: w[i + 1] })[0];
      if (d) { w2[i] = d; bad = [i]; break; }
    }
    if (!bad.length) for (const i of shuffle([...Array(Math.max(0, n - 1)).keys()])) {   // جابه‌جایی دو کلمه، اگر ترتیب جدید هم‌جایی معتبر نباشد
      if (w[i] === w[i + 1]) continue; const t = w.slice(); [t[i], t[i + 1]] = [t[i + 1], t[i]];
      if (![[t[i - 1], t[i]], [t[i], t[i + 1]], [t[i + 1], t[i + 2]]].some(p => p[0] != null && p[1] != null && BG().has(p[0] + ' ' + p[1]))) { w2 = t; bad = [i, i + 1]; type = 'swap'; break; }
    }
    return { w2, bad, type, wrong: 0, found: false, tip: false };
  },
  html: (it, st) => {
    const w = words(it.s, it.a);
    if (st.found) return `<p class="prompt">آفرین! پیدایش کردی. آیهٔ درست این است؛ بلند بخوانش</p>
      <div class="ayah big">${w.map((x, i) => `<span class="w${st.bad.includes(i) ? ' good' : ''}">${esc(x)}</span>`).join(' ')}</div>${contBtn}`;
    return `<p class="prompt">یکی از جاهای این آیه اشتباه است. پیدایش کن!</p>
      <div class="ayah big">${st.w2.map((x, i) => `<span class="w tap${st.tip && st.bad.includes(i) ? ' tip' : ''}" data-act="spotTap" data-i="${i}" role="button" tabindex="0">${esc(x)}</span>`).join(' ')}</div>
      <p class="muted" style="text-align:center">${st.tip ? 'راهنما: دور همان جای اشتباه خط‌چین کشیدم' : 'گاهی یک کلمه عوض شده، گاهی دو کلمه جایشان عوض شده'}</p>`;
  }
};

/* ---- حرف اول ---- */
WG.letters = {
  init: () => ({ revealed: false, shown: new Set() }),
  html: (it, st, c) => {
    const w = words(it.s, it.a);
