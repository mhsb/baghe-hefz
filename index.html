    <button class="btn ghost" data-act="resetKid" data-id="${id}">پاک‌کردن پیشرفت</button>
    <button class="btn danger" data-act="delKid" data-id="${id}">حذف این کودک</button>
    <button class="btn ghost small" data-act="close" style="margin:auto">بستن</button></div>`);
}
async function runPool(jobs, n, fn, onTick) { let i = 0, done = 0; await Promise.all([...Array(n)].map(async () => { while (i < jobs.length) { const j = jobs[i++]; await fn(j); onTick && onTick(++done, jobs.length); } })); }
async function auditAudio() {
  const jobs = []; SUR.forEach(s => { for (let a = 1; a <= s.v.length; a++) jobs.push({ s: s.id, a }); jobs.push({ s: s.id, a: 0 }); });
  const rep = { ay: {}, su: [] }, msg = $('#auMsg'), b = $('#auBtn'); b && (b.disabled = true);
  await runPool(jobs, 10, async j => { const ok = await probe(j.a ? ayUrl(j.s, j.a) : suUrl(j.s)); if (ok) { if (j.a) (rep.ay[j.s] = rep.ay[j.s] || []).push(j.a); else rep.su.push(j.s); } }, (d, t) => { if (msg && d % 25 === 0) msg.textContent = `در حال بررسی… ${fa(Math.round(d / t * 100))}٪`; });
  audioReport = rep; audioMode = {}; draw();
}
async function cacheAudio() {
  if (!('caches' in window)) { toast('ذخیرهٔ آفلاین فقط وقتی برنامه از آدرس اینترنتی باز شود کار می‌کند'); return; }
  const urls = []; Object.entries(audioReport.ay).forEach(([s, l]) => l.forEach(a => urls.push(ayUrl(+s, a)))); audioReport.su.forEach(s => urls.push(suUrl(s)));
  const cache = await caches.open('hifz-audio-v1'), msg = $('#auMsg'), b = $('#caBtn'); b && (b.disabled = true); let fail = 0;
  await runPool(urls, 4, async u => { try { if (!(await cache.match(u))) { const r = await fetch(u); if (r.ok) await cache.put(u, r); else fail++; } } catch (e) { fail++; } }, (d, t) => { if (msg) msg.textContent = `در حال ذخیره… ${fa(d)} از ${fa(t)}`; });
  if (msg) msg.textContent = fail ? `${fa(fail)} فایل ذخیره نشد. دوباره امتحان کنید.` : 'همهٔ صداها ذخیره شد و بدون اینترنت هم کار می‌کند.'; b && (b.disabled = false);
}
function exportBackup() { const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `baghe-hifz-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }

/* ============ اتصال دکمه‌ها ============ */
const applyFs = () => document.documentElement.style.setProperty('--fs', S.set.fs);
const same = (c) => sess && sess.cur === c;

function advance() {
  const c = sess.cur;
  if (c.si + 1 < c.steps.length) { c.si++; initStep(); }
  else completeItem(c.it.t === 'new' ? 'good' : qRes(c.mist));
  draw();
}
function cleanProfile(p) {
  const n = x => Number.isFinite(+x) ? +x : 0;
  const q = { id: String(p.id || uid()).replace(/[^\w-]/g, ''), name: String(p.name || 'کودک').slice(0, 20), av: AVATARS.includes(p.av) ? p.av : AVATARS[0],
    ay: {}, days: {}, stars: n(p.stars), streak: { cur: n(p.streak && p.streak.cur), best: n(p.streak && p.streak.best), last: /^\d{4}-\d\d-\d\d$/.test(p.streak && p.streak.last) ? p.streak.last : '' },
    goal: { newPerDay: Math.min(5, Math.max(1, n(p.goal && p.goal.newPerDay) || 2)), revMax: Math.min(20, Math.max(5, n(p.goal && p.goal.revMax) || 10)) },
    cur: byId[p.cur] ? +p.cur : PATH[0], created: /^\d{4}-\d\d-\d\d$/.test(p.created) ? p.created : today() };
  for (const k in (p.ay || {})) {
    const [s, a] = k.split(':').map(Number), x = p.ay[k];
    if (byId[s] && a >= 1 && a <= byId[s].v.length && x && /^\d{4}-\d\d-\d\d$/.test(x.d)) q.ay[k] = { b: Math.min(5, Math.max(1, n(x.b) || 1)), d: x.d, n: n(x.n), l: n(x.l), t: /^\d{4}-\d\d-\d\d$/.test(x.t) ? x.t : x.d };
  }
  for (const d in (p.days || {})) if (/^\d{4}-\d\d-\d\d$/.test(d)) { const r = p.days[d] || {}; q.days[d] = { st: n(r.st), nw: n(r.nw), rv: n(r.rv), star: r.star ? 1 : 0 }; }
  return q;
}
const unlock = () => { unlockUntil = Date.now() + 10 * 60 * 1000; gateQ = null; draw(); };
let surahRun = 0;

const A = {
  go: el => go(el.dataset.to || ''),
  close: () => closeModal(),
  doConfirm: () => { const f = window._cf; closeModal(); f && f(); },
  install: async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) { } deferredPrompt = null; draw(); },

  /* کودکان */
  pick: el => { S.active = el.dataset.id; save(); go(''); },
  av: el => { tmpAv = el.dataset.av; document.querySelectorAll('.avs button').forEach(b => b.setAttribute('aria-pressed', b === el)); },
  create: () => {
    const name = ($('#nm').value || '').trim().slice(0, 20); if (!name) { toast('اسمت را بنویس'); $('#nm').focus(); return; }
    newProfile(name, tmpAv); tmpAv = AVATARS[0]; go('');
  },

  /* درس */
  start: el => startMode(el.dataset.mode),
  learnFrom: el => { closeModal(); startLearnFrom(+el.dataset.s, +el.dataset.a); },
  practiceOne: el => { closeModal(); startSession([{ t: 'rev', s: +el.dataset.s, a: +el.dataset.a, pr: true }]); },
  practiceSurah: el => {
    const sid = +el.dataset.s, q = [];
    for (let a = 1; a <= byId[sid].v.length; a++) if (learned(sid, a)) q.push({ t: 'rev', s: sid, a, pr: true });
    startSession(shuffle(q).slice(0, 8));
  },
  sheet: el => sheet(+el.dataset.s, +el.dataset.a),
  quit: () => confirmBox('درس نیمه‌کاره بماند؟ آیه‌هایی که تمام کرده‌ای ذخیره شده‌اند.', 'خروج', () => { stopAudio(); sess = null; go(''); }),
  endSess: el => { stopAudio(); const to = el.dataset.to; sess = null; go(to); },
  nextItem: () => { sess.i++; if (sess.i >= sess.q.length) endOfSessionAward(); else beginItem(); draw(); window.scrollTo(0, 0); },
  step: () => { const c = sess.cur; if (c.steps[c.si] === 'listen') { stopAudio(); c.st.run++; } advance(); },
  play: () => listenLoop(),
  readAloud: () => { const st = sess.cur.st; if (st.done < st.n) st.done++; draw(); },
  meaning: () => { const st = sess.cur.st; st.meaning = !st.meaning; draw(); },
  hear: el => hear(+el.dataset.s, +el.dataset.a),
  reveal: () => { sess.cur.st.revealed = true; draw(); },
  rate: el => {
    const c = sess.cur, r = el.dataset.r;
    if (c.it.t === 'new' && r === 'again') { c.si = 0; initStep(); draw(); return; }
    completeItem(r); draw();
  },
  bPick: el => {
    const c = sess.cur, st = c.st, o = st.opts[+el.dataset.i];
    if (o.ok) {
      el.classList.add('ok'); chime(); document.querySelectorAll('.opts .opt').forEach(b => b.disabled = true);
      setTimeout(() => { if (!same(c)) return; st.k++; if (st.k >= st.hidden.length) advance(); else { st.opts = blankOpts(st, words(c.it.s, c.it.a), c.it); draw(); } }, 500);
    } else { c.mist++; st.wrong++; el.classList.add('no'); el.disabled = true; chime('bad'); }
  },
  oPick: el => {
    const c = sess.cur, st = c.st, i = +el.dataset.i;
    if (st.u[i] === st.u[st.placed.length]) { st.placed.push(i); chime(); draw(); }
    else { c.mist++; el.classList.add('no'); chime('bad'); setTimeout(() => el.classList.remove('no'), 500); }
  },
  nPick: el => {
    const c = sess.cur, st = c.st; if (st.solved) return; const o = st.opts[+el.dataset.i];
    if (o.ok) { o.cls = 'ok'; st.solved = true; chime(); } else { o.cls = 'no'; st.wrong++; c.mist++; chime('bad'); }
    draw();
  },
  finishQ: () => { const c = sess.cur; completeItem(qRes(c.st.wrong)); draw(); },

  /* باغ */
  listenSurah: async el => {
    if (el.dataset.on) { surahRun++; stopAudio(); el.removeAttribute('data-on'); el.textContent = '🔊 گوش دادن به کل سوره'; return; }
    const s = +el.dataset.s, my = ++surahRun; el.dataset.on = 1; el.textContent = '⏹ توقف';
    let r = await playSurahFile(s);
    if (r === 'fail' && my === surahRun) { for (let a = 1; a <= byId[s].v.length && my === surahRun; a++) { r = await playAyah(s, a); if (r !== 'ended') break; await sleep(350); } }
    if (my !== surahRun) return;
    if (r === 'fail') toast('فایل صوتی پیدا نشد. راهنما در بخش والدین است');
    const b = $('#lsBtn'); if (b) { b.removeAttribute('data-on'); b.textContent = '🔊 گوش دادن به کل سوره'; }
  },

  /* والدین */
  mathGo: () => { const v = normDigits($('#ans').value); if (gateQ && v === String(gateQ.r)) unlock(); else { toast('جواب درست نبود. دوباره امتحان کن'); gateQ = mathQ(false); draw(); } },
  pinGo: () => { if (normDigits($('#pin').value) === S.set.pin) unlock(); else { toast('رمز درست نبود'); $('#pin').value = ''; } },
  pinForgot: () => { gateQ = mathQ(true); draw(); },
  lockNow: () => { unlockUntil = 0; gateQ = null; go(''); },
  setPin: () => openModal(`<div class="stack"><b style="font-size:1.15rem">رمز چهار رقمی</b>
    <input type="password" id="npin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="رمز تازه" style="text-align:center;font-size:1.6rem;letter-spacing:.5em">
    <button class="btn" data-act="savePin">ذخیره</button><button class="btn ghost" data-act="close">بیخیال</button></div>`),
  savePin: () => { const v = normDigits($('#npin').value); if (!/^\d{4}$/.test(v)) { toast('رمز باید چهار رقم باشد'); return; } S.set.pin = v; save(); closeModal(); toast('رمز ذخیره شد'); draw(); },
  clearPin: () => { S.set.pin = ''; save(); draw(); },
  addKid: () => go('who'),
  pEdit: el => editKid(el.dataset.id),
  saveKid: el => {
    const p = S.profiles[el.dataset.id], nm = ($('#ename').value || '').trim().slice(0, 20);
    if (nm) p.name = nm; p.goal.newPerDay = +$('#enew').value; p.goal.revMax = +$('#erev').value; save(); closeModal(); draw(); toast('ذخیره شد');
  },
  useKid: el => { S.active = el.dataset.id; save(); closeModal(); draw(); toast('کودک فعال عوض شد'); },
  resetKid: el => { const id = el.dataset.id; confirmBox('همهٔ پیشرفت این کودک پاک می‌شود. مطمئنی؟', 'پاک کن', () => { const p = S.profiles[id]; p.ay = {}; p.days = {}; p.stars = 0; p.streak = { cur: 0, best: 0, last: '' }; p.cur = PATH[0]; save(); draw(); }, true); },
  delKid: el => { const id = el.dataset.id; confirmBox('این کودک و پیشرفتش حذف می‌شود. مطمئنی؟', 'حذف کن', () => { delete S.profiles[id]; if (S.active === id) S.active = Object.keys(S.profiles)[0] || null; save(); draw(); }, true); },
  snd: () => { S.set.sound = !S.set.sound; save(); draw(); },
  audit: () => auditAudio(),
  cacheAudio: () => cacheAudio(),
  export: () => exportBackup(),
  import: () => $('#impf').click(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { if (!el.disabled && A[el.dataset.act]) A[el.dataset.act](el, e); return; }
  const w = e.target.closest('#rec .w.hide'); if (w) w.classList.remove('hide');
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.inp; if (!k) return;
  const v = +e.target.value; S.set[k] = v;
  if (k === 'repeats') $('#rpv').textContent = fa(v);
  if (k === 'rate') $('#rtv').textContent = fa(v.toFixed(2));
  if (k === 'fs') applyFs();
  save();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'impf') return;
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    try {
      const j = JSON.parse(t); if (!(j && j.v === 1 && j.profiles && typeof j.profiles === 'object')) throw 0;
      confirmBox('پیشرفت فعلی این دستگاه با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهی؟', 'جایگزین کن', () => {
        const ns = fresh(); ns.set = Object.assign(ns.set, j.set || {});
        ns.set.rate = Math.min(1.2, Math.max(.7, +ns.set.rate || 1)); ns.set.repeats = Math.min(7, Math.max(1, +ns.set.repeats || 3)); ns.set.fs = Math.min(1.4, Math.max(.9, +ns.set.fs || 1));
        ns.set.pin = /^\d{4}$/.test(ns.set.pin) ? ns.set.pin : ''; ns.set.sound = ns.set.sound !== false;
        Object.values(j.profiles).forEach(p => { const q = cleanProfile(p || {}); ns.profiles[q.id] = q; });
        ns.active = ns.profiles[j.active] ? j.active : Object.keys(ns.profiles)[0] || null;
        S = ns; save(); applyFs(); toast('بازیابی شد'); draw();
      }, true);
    } catch (_) { toast('این فایل پشتیبان معتبر نیست'); }

});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key !== 'Enter') return;

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (R().name !== 'lesson') draw(); });

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
